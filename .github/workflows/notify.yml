# ════════════════════════════════════════════════════════════════════
# 밀린 알림을 카카오 알림톡(없으면 문자)으로 내보냅니다
#
# 왜 이렇게 하나
#   사이트는 정적 파일이라 서버가 없습니다. 브라우저에서 대행사를 직접
#   부르면 CORS 로 막히고 **API 키가 화면 소스에 노출**됩니다.
#   여기서 돌리면 키는 GitHub Secrets 에만 있습니다.
#   저장소가 공개라 Actions 분은 무료·무제한입니다.
#
# 왜 한 시간에 한 번인가
#   알림톡은 건당 돈이 나갑니다. 요청이 올라오자마자 1초 만에 보낼
#   필요는 없습니다. 대신 한 번 돌 때 큐를 **다 비웁니다.**
#
# 밤에도 돕니다 (24시간)
#   축산은 낮에만 돌아가지 않습니다. 도축장은 새벽에 시작하고,
#   당일알바는 밤에 올라와야 다음 날 새벽에 사람이 붙습니다.
#   밤 11시 "내일 새벽 발골 3명" 을 아침에 보내면 그때는 늦습니다.
#   (야간 발송 제한은 광고성에만 걸립니다 — 우리 건 정보성입니다)
#   막고 싶어지면 Secrets 에 QUIET_HOURS="21-8" 하나만 넣으면 됩니다.
#
# 운영자가 할 일 (한 번만)
#   1) db/phase8_notify.sql → phase9_invite.sql → phase10_24h.sql 을
#      Supabase SQL Editor 에서 순서대로 실행
#   2) 대행사(솔라피 등) 가입 → 발신번호 등록 → API 키 발급
#   3) 카카오 비즈니스 채널 → 발신프로필 등록 → 템플릿 심사 (2주쯤)
#   4) 저장소 → Settings → Secrets and variables → Actions 에 넣기
#        SUPABASE_URL · SUPABASE_SERVICE_KEY
#        SOLAPI_KEY · SOLAPI_SECRET · SOLAPI_FROM
#        ALIMTALK_PFID · ALIMTALK_TPL_REQUEST · _QUOTE · _SELECTED
#
#   ⚠️ service_role 키는 RLS 를 지나칩니다. Secrets 에만 두세요.
#   심사 전에도 ALIMTALK_* 없이 돌아갑니다 — 그동안은 문자로 나갑니다.
# ════════════════════════════════════════════════════════════════════
name: 알림 내보내기

on:
  schedule:
    # ⚠️ 실제로 재 본 결과입니다 (2026-09-12~14, Actions 실행 기록).
    #    15분마다(하루 52회)로 걸어 뒀는데 **하루 서너 번**만 돌았습니다.
    #    게다가 23:08 · 23:35 KST 처럼 **걸어 두지 않은 시각**에도 돌았습니다 —
    #    GitHub 은 밀린 예약을 나중에 몰아서 돌립니다.
    #    촘촘히 걸어도 소용없으니 한 시간에 한 번으로 줄이고, 대신 한 번
    #    돌 때 큐를 다 비웁니다. 지켜야 할 규칙은 예약 시각이 아니라
    #    코드에 둡니다 (tools/notify-send.js).
    - cron: "7 * * * *"
  workflow_dispatch:

# 앞 차례가 아직 돌고 있으면 새로 띄우지 않습니다 — 두 번 보내면
# 두 번 과금됩니다.
concurrency:
  group: gori-notify
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 알림 보내기
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          SOLAPI_KEY:            ${{ secrets.SOLAPI_KEY }}
          SOLAPI_SECRET:         ${{ secrets.SOLAPI_SECRET }}
          SOLAPI_FROM:           ${{ secrets.SOLAPI_FROM }}
          ALIMTALK_PFID:         ${{ secrets.ALIMTALK_PFID }}
          ALIMTALK_TPL_REQUEST:  ${{ secrets.ALIMTALK_TPL_REQUEST }}
          ALIMTALK_TPL_QUOTE:    ${{ secrets.ALIMTALK_TPL_QUOTE }}
          ALIMTALK_TPL_SELECTED: ${{ secrets.ALIMTALK_TPL_SELECTED }}
        run: node tools/notify-send.js
