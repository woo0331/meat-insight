# ════════════════════════════════════════════════════════════════════
#  작업 브랜치에 올리면 — 전부 검사하고, 초록이면 main 으로 합칩니다
#
#  ⚠️⚠️ main 에 합치는 것이 곧 배포입니다. Vercel 이 main 을 보고
#  곧바로 올립니다 — 이 일감이 main 을 밀면 그 순간 손님 화면이
#  바뀝니다. 그래서 **빨간 것이 하나라도 있으면 합치지 않습니다.**
#
#  ⚠️⚠️ 사람이 확인하는 자리를 "검사가 전부 초록" 으로 바꿨습니다
#  (2026-10-15 사장님 지시). CLAUDE.md 의 2026-10-08 §24 가 적어 둔
#  "사용자의 최종 확인 후" 자리를 이 일감과 tools/ship.js 가 받습니다.
#
#  ⚠️ 비밀을 하나도 안 씁니다. Vercel 은 main 을 스스로 보고 배포하고,
#  여기서 쓰는 토큰은 GitHub 이 일감에 주는 것뿐입니다.
#
#  ⚠️ 손으로 멈추시려면 — GitHub → Actions → 이 워크플로 → Disable.
#     그 뒤로는 main 이 저절로 움직이지 않습니다.
# ════════════════════════════════════════════════════════════════════
name: 검사하고 main 으로 (배포)

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "초록이면 main 으로 합칠까요"
        type: boolean
        default: true

# ⚠️ 두 줄이 동시에 main 을 밀면 한쪽이 ff 에서 떨어집니다 — 줄을 세웁니다.
concurrency:
  group: ship-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    name: 전수 검사 → main
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ⚠️ fetch-depth:0 — merge-base 로 ff 가 되는지 보고, main 을
      #    여기서 합쳐 밀어야 해서 역사가 다 필요합니다.
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ⚠️⚠️ 이 저장소는 playwright 를 두 가지로 부릅니다 —
      #    check.js 등 여섯은 /opt/node22/lib/node_modules/playwright 를
      #    글자로 박고, test-flows 등 셋은 그냥 require("playwright")
      #    입니다. 열네 파일을 고치지 않고 **둘 다 닿게** 해 둡니다.
      #    (판은 개발 환경과 같은 1.56.1 로 박습니다 — 올리실 때는
      #     여기와 개발 환경을 같이 올리세요.)
      - name: playwright 1.56.1 + 크로미움
        run: |
          set -euo pipefail
          npm i -g playwright@1.56.1
          GROOT="$(npm root -g)"
          playwright install --with-deps chromium
          sudo mkdir -p /opt/node22/lib/node_modules
          sudo ln -sfn "$GROOT/playwright" /opt/node22/lib/node_modules/playwright
          sudo ln -sfn "$GROOT/playwright-core" /opt/node22/lib/node_modules/playwright-core || true
          echo "NODE_PATH=$GROOT" >> "$GITHUB_ENV"
          node -e 'require("/opt/node22/lib/node_modules/playwright");console.log("박은 경로 OK")'
          NODE_PATH="$GROOT" node -e 'require("playwright");console.log("이름으로도 OK")'

      # ⚠️⚠️ tools/test-sql.js 는 initdb 로 임시 클러스터를 **스스로**
      #    띄웁니다. 없으면 그 검사가 exit 2 로 끝나고, ship.js 가
      #    그것을 **통과로 치지 않고 배포를 막습니다** — 그래서 깔아
      #    둡니다 (서버 패키지가 있어야 initdb 가 생깁니다).
      - name: Postgres (initdb · psql)
        run: |
          set -euo pipefail
          BIN="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | tail -1 || true)"
          if [ -z "$BIN" ] || [ ! -x "$BIN/initdb" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql
            BIN="$(ls -d /usr/lib/postgresql/*/bin | tail -1)"
          fi
          echo "$BIN" >> "$GITHUB_PATH"
          "$BIN/initdb" --version
          "$BIN/psql" --version

      - name: 누구로 커밋하나
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ⚠️⚠️ --ci — 커밋을 만들지 않고, 대신 **빌드 결과가 커밋과
      #    같은지** 봅니다. build-pages.js 를 잊고 올리면 저장소와
      #    손님 화면이 어긋나는데 화면으로는 표가 안 납니다.
      - name: 검사 전부 + 초록이면 main
        if: github.event_name == 'push' || inputs.deploy
        run: node tools/ship.js --ci

      - name: 검사만 (합치지 않음)
        if: github.event_name == 'workflow_dispatch' && !inputs.deploy
        run: node tools/ship.js --ci --check-only

      # 떨어졌을 때 눈으로 볼 것 — 검사가 찍어 둔 그림
      - name: 떨어진 자리 그림
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: |
            test/*.png
            /tmp/shots/*.png
          if-no-files-found: ignore
          retention-days: 7
