<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 · 시작과 정리</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B5CFF">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  /* 색·글씨 단계는 본 사이트(css/tokens.css)와 **같은 값이어야 합니다.**
     이 화면은 라우터 밖에서 혼자 떠야 하므로 토큰을 여기 한 번 더 둡니다 —
     본 사이트 CSS 를 불러오면 헤더·푸터까지 딸려 와 빈 껍데기가 보입니다.

     ⚠️ **베껴 둔 값이라 조용히 낡습니다.** 토큰을 바꾸고 여기를 안
     고치면 404 만 옛 색으로 남습니다 — 에러도 안 나고 아무도 안 봅니다.
     check.js 의 "404 가 본 사이트와 같은 색을 쓴다" 가 잡습니다. */
  :root{
    --burgundy:#1B5CFF; --burgundy-600:#1246CC; --bg:#F7F8FA; --surface:#fff;
    --ink:#0F1B2D; --ink2:#67676D; --line:#EAE7E5;
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
           "Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{ margin:0; font-family:var(--font); background:var(--bg); color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column; line-height:1.68;
    word-break:keep-all; overflow-wrap:anywhere; }
  .hd{ background:var(--surface); border-bottom:1px solid var(--line); }
  .hd a{ display:flex; flex-direction:column; justify-content:center; height:68px;
    max-width:1200px; margin:0 auto; padding:0 24px; text-decoration:none; }
  .hd b{ font-size:19px; font-weight:800; letter-spacing:.055em; color:var(--burgundy); }
  .hd span{ font-size:13px; color:#9A9AA2; margin-top:1px; }
  main{ flex:1; max-width:760px; margin:0 auto; padding:80px 24px 96px; width:100%; }
  .code{ display:inline-block; font-size:13.5px; font-weight:800; letter-spacing:.09em;
    color:var(--burgundy); margin-bottom:16px; }
  h1{ font-size:28px; font-weight:800; letter-spacing:-.025em; margin:0 0 12px; line-height:1.28; }
  p{ font-size:18px; color:var(--ink2); margin:0 0 32px; }
  .acts{ display:flex; gap:12px; flex-wrap:wrap; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; min-height:56px;
    padding:0 32px; border-radius:999px; font-size:18px; font-weight:700; text-decoration:none;
    border:1px solid var(--line); background:var(--surface); color:var(--ink); }
  .btn:hover{ border-color:var(--burgundy); color:var(--burgundy); }
  .btn-b{ background:var(--burgundy); border-color:var(--burgundy); color:#fff; }
  .btn-b:hover{ background:var(--burgundy-600); color:#fff; }
  h2{ font-size:15px; margin:48px 0 12px; }
  ul{ margin:0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:8px; }
  ul a{ display:inline-flex; align-items:center; min-height:44px; padding:0 20px;
    border:1px solid var(--line); border-radius:999px; background:var(--surface);
    font-size:15px; font-weight:600; color:var(--ink2); text-decoration:none; }
  ul a:hover{ border-color:var(--burgundy); color:var(--burgundy); }
  /* ⚠️ 푸터를 브랜드색으로 칠하지 마세요. 버건디를 면으로 쓰는 곳은
     브랜드색을 넓게 쓰는 자리가 둘이 되면 그때부터 장식입니다. */
  footer{ background:#F4F2EF; color:#9A9AA2; font-size:12.5px;
    padding:28px 24px; text-align:center; border-top:1px solid var(--line); }
  @media (max-width:640px){ main{ padding:56px 16px 72px; } h1{ font-size:24px; } .hd a{ padding:0 16px; } }
</style>
</head>
<body>
  <header class="hd">
    <a href="/"><b>시작과 정리</b><span>창업 · 폐업 전문 플랫폼</span></a>
  </header>

  <main>
    <span class="code">404</span>
    <h1>찾으시는 페이지가 없습니다.</h1>
    <p>주소가 바뀌었을 수 있습니다.<br>
       창업과 폐업 둘 중 하나를 고르시면 거기서 다시 찾으실 수 있습니다.</p>

    <div class="acts">
      <a class="btn btn-b" href="/startup">창업 시작하기</a>
      <a class="btn" href="/closure">폐업 시작하기</a>
    </div>

    <h2>많이 찾으시는 것</h2>
    <ul>
      <li><a href="/providers">업체찾기</a></li>
      <li><a href="/franchise">프랜차이즈</a></li>
      <li><a href="/stores">점포 · 상가</a></li>
      <li><a href="/assets">시설 · 집기</a></li>
      <li><a href="/quote">견적 요청</a></li>
      <li><a href="/join">업체 입점하기</a></li>
      <li><a href="/search">검색</a></li>
    </ul>
  </main>

  <footer>© 시작과 정리. All rights reserved.</footer>
</body>
</html>
