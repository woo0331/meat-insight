<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>페이지를 찾을 수 없습니다 — 고리</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'><circle cx='13' cy='13' r='13' fill='%23B3164C'/><path d='M7 14 C7 10 10 7 14 7 C18 7 21 10 21 14 C21 17.5 18 20 14 20 L9 20' stroke='white' stroke-width='2.5' stroke-linecap='round' fill='none'/><circle cx='8' cy='20' r='2' fill='white'/></svg>"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gn:#B3164C;--gn2:#8A0F3A;--gnl:#FDE8EF;--gnb:#F6C6D6;--gn-on-tint:#8A0F3A;
  --ink:#14181C;--ink2:#3A4149;--ink3:#5E636A;--ink4:#676C75;
  --bd:#EAE8E4;--bd2:#D9D6D0;--bg2:#F2F1ED;--navy:#12161B;
  --font:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;
}
body{font-family:var(--font);background:#fff;color:var(--ink);letter-spacing:-.02em;
  -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
.wrap{flex:1;max-width:640px;margin:0 auto;padding:64px 24px 72px;width:100%;}
.mark{display:flex;align-items:center;gap:9px;margin-bottom:44px;}
.mark span{font-size:21px;font-weight:800;color:var(--ink);}
.code{display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:.06em;
  background:var(--gnl);color:var(--gn-on-tint);border-radius:999px;padding:6px 14px;margin-bottom:16px;}
h1{font-size:32px;font-weight:800;line-height:1.3;letter-spacing:-.04em;margin-bottom:12px;}
p.lead{font-size:15.5px;color:var(--ink3);line-height:1.7;font-weight:500;margin-bottom:30px;}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:40px;}
.btn{min-height:50px;display:inline-flex;align-items:center;justify-content:center;
  padding:0 22px;border-radius:12px;font-size:15px;font-weight:700;text-decoration:none;
  border:1.5px solid var(--bd2);background:#fff;color:var(--ink2);cursor:pointer;font-family:var(--font);}
.btn:hover{border-color:var(--gn);color:var(--gn);}
.btn.p{background:var(--gn);border-color:var(--gn);color:#fff;}
.btn.p:hover{background:var(--gn2);border-color:var(--gn2);color:#fff;}
.links-t{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:12px;}
.links{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.links a{display:block;padding:14px 16px;border:1px solid var(--bd);border-radius:12px;
  font-size:14.5px;font-weight:600;color:var(--ink2);text-decoration:none;}
.links a:hover{border-color:var(--gn);color:var(--gn);background:var(--gnl);}
:focus-visible{outline:3px solid var(--gn);outline-offset:2px;}
@media(max-width:600px){
  .wrap{padding:40px 20px 56px;}
  h1{font-size:26px;}
  .links{grid-template-columns:1fr;}
  .acts .btn{flex:1;}
}
</style>
</head>
<body>
<div class="wrap">
  <a class="mark" href="index.html" style="text-decoration:none;">
    <svg width="34" height="34" viewBox="0 0 26 26" fill="none" aria-hidden="true">
      <circle cx="13" cy="13" r="13" fill="#B3164C"/>
      <path d="M7 14 C7 10 10 7 14 7 C18 7 21 10 21 14 C21 17.5 18 20 14 20 L9 20" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <circle cx="8" cy="20" r="2" fill="white"/>
    </svg>
    <span>고리</span>
  </a>

  <div class="code">404</div>
  <h1>이 주소에는 아무것도 없습니다</h1>
  <p class="lead">주소가 바뀌었거나, 잘못 입력하셨을 수 있습니다.<br>
    아래에서 필요한 곳으로 바로 갈 수 있습니다.</p>

  <div class="acts">
    <a class="btn p" href="index.html">홈으로</a>
    <a class="btn" href="index.html#/rw">요청 올리기</a>
    <a class="btn" href="index.html#/guide">이용 가이드</a>
  </div>

  <div class="links-t">많이 찾는 화면</div>
  <div class="links">
    <a href="index.html#/reqs">실시간 요청</a>
    <a href="index.html#/suppliers">업체 찾기</a>
    <a href="index.html#/jobs">인력·구인구직</a>
    <a href="index.html#/market">축산 시세</a>
    <a href="index.html#/sj">업체 등록</a>
    <a href="index.html#/contact">문의하기</a>
  </div>
</div>
<script src="site-info.js"></script>
<script src="legacy-chrome.js"></script>
</body>
</html>
