<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 · <!--brand-->폰웨이<!--/brand--></title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#302015">
<meta name="color-scheme" content="only light">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  /* 색·글씨 단계는 본 사이트(css/tokens.css)와 **같은 값이어야 합니다.**
     이 화면은 라우터 밖에서 혼자 떠야 하므로 토큰을 여기 한 번 더 둡니다 —
     본 사이트 CSS 를 불러오면 헤더·푸터까지 딸려 와 빈 껍데기가 보입니다.

     ⚠️ **베껴 둔 값이라 조용히 낡습니다.** 토큰을 바꾸고 여기를 안
     고치면 404 만 옛 색으로 남습니다 — 에러도 안 나고 아무도 안 봅니다.
     check.js 의 "404 가 본 사이트와 같은 색을 쓴다" 가 잡습니다. */
  :root{
    color-scheme: only light;   /* ⚠️ 자동 다크모드 반전 끄기 — css/tokens.css 와 같은 줄입니다 */
    --navy:#302015; --navy-dark:#291B0E; --bg:#FFF7ED; --surface:#fff;
    /* ⚠️ 이 화면은 라우터 밖이라 `css/tokens.css` 를 **안 읽습니다** —
       색을 바꾸면 여기도 같이 고쳐야 합니다. 2026-10-01 에 글자 세 단계를
       읽히는 값으로 내리면서 여기만 옛 값(--ink3 #74604F, 대비 3.66)이
       남아 있었습니다.
       ⚠️⚠️ **2026-10-13 §2 에서 또 그랬습니다.** 팔레트가 베이지 ·
       브라운으로 통째로 바뀌었는데 여기만 **옛 블루**(--navy #A33E06 ·
       --ink #432919)로 남아 있어서, 404 화면 하나만 다른 사이트로
       보였습니다. 토큰을 고치실 때는 **여기 · manifest.json ·
       index.html 의 theme-color** 를 같이 보세요.
       ⚠️⚠️ **2026-10-29 PHONEWAY 전환에서 또 그랬습니다** (세 번째) —
       머리 · 꼬리가 딥 네이비가 됐는데 여기만 **베이지 · 브라운**으로
       남아 있었습니다. 지금 값은 `css/tokens.css` 의 `--pw-*` 를 베낀
       것입니다 (navy #302015 · bg #FFF7ED · ink #231A16 · line #EEE6DF).
       ⚠️⚠️ **2026-10-30 시안 팔레트로 다섯을 또 고쳤습니다** (네 번째). */
    --ink:#231A16; --ink2:#5A4433; --ink3:#6C635C; --line:#EEE6DF;
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
           "Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{ margin:0; font-family:var(--font); background:var(--bg); color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column; line-height:1.68;
    word-break:keep-all; overflow-wrap:anywhere; }
  .hd{ background:var(--surface); border-bottom:1px solid var(--line); }
  .hd a{ display:flex; flex-direction:column; justify-content:center; height:72px;
    max-width:1440px; margin:0 auto; padding:0 32px; text-decoration:none; }
  .hd b{ font-size:19px; font-weight:900; letter-spacing:-.03em; color:var(--ink); }
  .hd span{ font-size:13px; color:var(--ink3); margin-top:1px; }
  main{ flex:1; max-width:760px; margin:0 auto; padding:80px 24px 96px; width:100%; }
  .code{ display:inline-block; font-size:13.5px; font-weight:800; letter-spacing:.09em;
    color:var(--navy); margin-bottom:16px; }
  h1{ font-size:28px; font-weight:800; letter-spacing:-.025em; margin:0 0 12px; line-height:1.28; }
  p{ font-size:18px; color:var(--ink2); margin:0 0 32px; }
  .acts{ display:flex; gap:12px; flex-wrap:wrap; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; min-height:56px;
    padding:0 32px; border-radius:14px; font-size:18px; font-weight:700; text-decoration:none;
    border:1px solid var(--line); background:var(--surface); color:var(--ink); }
  .btn:hover{ border-color:var(--navy); color:var(--navy); }
  .btn-b{ background:var(--navy); border-color:var(--navy); color:#fff; }
  .btn-b:hover{ background:var(--navy-dark); color:#fff; }
  h2{ font-size:15px; margin:48px 0 12px; }
  ul{ margin:0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:8px; }
  ul a{ display:inline-flex; align-items:center; min-height:44px; padding:0 20px;
    border:1px solid var(--line); border-radius:999px; background:var(--surface);
    font-size:15px; font-weight:600; color:var(--ink2); text-decoration:none; }
  ul a:hover{ border-color:var(--navy); color:var(--navy); }
  /* ⚠️ 12px 미만 금지 — 본 사이트와 같은 기준입니다. */
  footer{ background:var(--surface); color:var(--ink3); font-size:13px;
    padding:28px 24px; text-align:center; border-top:1px solid var(--line); }
  @media (max-width:640px){ main{ padding:56px 16px 72px; } h1{ font-size:24px; } .hd a{ padding:0 16px; } }
</style>
</head>
<body>
  <header class="hd">
    <a href="/"><b><!--brand-->폰웨이<!--/brand--></b><span>사장님의 다음을 함께하는 플랫폼</span></a>
  </header>

  <main>
    <span class="code">404</span>
    <h1>찾으시는 페이지가 없습니다.</h1>
    <p>주소가 바뀌었을 수 있습니다.<br>
       창업과 폐업 둘 중 하나를 고르시면 거기서 다시 찾으실 수 있습니다.</p>

    <div class="acts">
      <a class="btn btn-b" href="/startup">창업 시작하기</a>
      <a class="btn" href="/closure">폐업 시작하기</a>
    </div>

    <h2>바로 가기</h2>
    <ul>
      <li><a href="/providers">업체찾기</a></li>
      <li><a href="/franchise">프랜차이즈</a></li>
      <li><a href="/stores">점포 · 상가</a></li>
      <li><a href="/assets">시설 · 집기</a></li>
      <li><a href="/quote">견적 요청</a></li>
      <li><a href="/join">업체 입점하기</a></li>
      <li><a href="/search">검색</a></li>
    </ul>
  </main>

  <footer>© <!--brand-->폰웨이<!--/brand-->. All rights reserved.</footer>
</body>
</html>
