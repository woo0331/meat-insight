<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 · ABOUTMEAT</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#123D32">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  /* 색·글씨 단계는 본 사이트(css/tokens.css)와 같은 값입니다.
     이 화면은 라우터 밖에서 혼자 떠야 하므로 토큰을 여기 한 번 더 둡니다 —
     본 사이트 CSS 를 불러오면 헤더·푸터까지 딸려 와 빈 껍데기가 보입니다. */
  :root{
    --green:#123D32; --green-400:#2A5A4C; --ivory:#F6F4EE; --white:#fff;
    --ink:#202522; --ink2:#6B706D; --line:#E7E4DC;
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
           "Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{ margin:0; font-family:var(--font); background:var(--ivory); color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column; line-height:1.62; }
  .hd{ background:var(--white); border-bottom:1px solid var(--line); }
  .hd a{ display:flex; flex-direction:column; justify-content:center; height:72px;
    max-width:1280px; margin:0 auto; padding:0 24px; text-decoration:none; }
  .hd b{ font-size:20px; font-weight:800; letter-spacing:.06em; color:var(--green); }
  .hd span{ font-size:12.5px; color:var(--ink2); margin-top:1px; }
  main{ flex:1; max-width:640px; margin:0 auto; padding:80px 24px 96px; width:100%; }
  .code{ display:inline-block; font-size:12.5px; font-weight:800; letter-spacing:.06em;
    background:#EEF2EE; color:var(--green); border-radius:999px; padding:6px 14px; margin-bottom:18px; }
  h1{ font-size:32px; font-weight:800; letter-spacing:-.03em; margin:0 0 12px; line-height:1.3; }
  p{ font-size:15px; color:var(--ink2); margin:0 0 32px; }
  .acts{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; min-height:48px;
    padding:0 24px; border-radius:10px; font-size:15px; font-weight:700; text-decoration:none;
    border:1px solid var(--line); background:var(--white); color:var(--ink); }
  .btn:hover{ border-color:var(--green); color:var(--green); }
  .btn-g{ background:var(--green); border-color:var(--green); color:#fff; }
  .btn-g:hover{ background:var(--green-400); color:#fff; }
  h2{ font-size:15px; margin:48px 0 12px; }
  ul{ margin:0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:8px; }
  ul a{ display:inline-flex; align-items:center; min-height:40px; padding:0 16px;
    border:1px solid var(--line); border-radius:999px; background:var(--white);
    font-size:14px; font-weight:600; color:var(--ink2); text-decoration:none; }
  ul a:hover{ border-color:var(--green); color:var(--green); }
  footer{ background:var(--green); color:rgba(255,255,255,.7); font-size:12.5px;
    padding:28px 24px; text-align:center; }
  @media (max-width:640px){ main{ padding:56px 16px 72px; } h1{ font-size:24px; } .hd a{ padding:0 16px; } }
</style>
</head>
<body>
  <header class="hd">
    <a href="/"><b>ABOUTMEAT</b><span>축산 부산물 전문마켓</span></a>
  </header>

  <main>
    <span class="code">404</span>
    <h1>찾으시는 페이지가 없습니다.</h1>
    <p>주소가 바뀌었거나, 판매가 끝난 상품일 수 있습니다.<br>
       아래에서 필요하신 부산물을 바로 찾아보세요.</p>

    <div class="acts">
      <a class="btn btn-g" href="/">홈으로</a>
      <a class="btn" href="/#/products">전체상품 보기</a>
    </div>

    <h2>많이 찾는 부위</h2>
    <ul>
      <li><a href="/#/c/beef">소 부산물</a></li>
      <li><a href="/#/c/pork">돼지 부산물</a></li>
      <li><a href="/#/c/beef/gut">곱창·대창</a></li>
      <li><a href="/#/c/beef/gut/makchang">막창</a></li>
      <li><a href="/#/enc">부산물 도감</a></li>
      <li><a href="/#/b2b">업소용 대량구매</a></li>
    </ul>
  </main>

  <footer>© ABOUTMEAT. All rights reserved.</footer>
</body>
</html>
