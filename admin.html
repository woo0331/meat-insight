<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상품 관리 · ABOUTMEAT</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<style>
/* 관리자 화면은 손님 화면과 다릅니다 — 한 화면에 많이 보여야 합니다 */
body{ background:var(--ivory); }
.ad-hd{ background:var(--green); color:#fff; padding:var(--s4) 0; }
.ad-hd .w{ display:flex; align-items:center; gap:var(--s5); flex-wrap:wrap; }
.ad-hd b{ font-size:18px; font-weight:800; letter-spacing:.05em; }
.ad-hd span{ font-size:var(--t-sm); color:rgba(255,255,255,.72); }
.ad-hd .sp{ margin-left:auto; display:flex; gap:var(--s2); }
.ad-hd a{ font-size:var(--t-sm); color:rgba(255,255,255,.8); min-height:40px;
  display:inline-flex; align-items:center; padding:0 var(--s3);
  border:1px solid rgba(255,255,255,.28); border-radius:var(--r); }
.ad-hd a:hover{ background:rgba(255,255,255,.12); color:#fff; }

.ad-tabs{ background:var(--white); border-bottom:1px solid var(--line); }
.ad-tabs .w{ display:flex; gap:var(--s6); }
.ad-tab{ min-height:52px; display:inline-flex; align-items:center; border:0; background:none;
  font-size:var(--t-md); font-weight:700; color:var(--ink2); cursor:pointer; position:relative;
  font-family:var(--font); }
.ad-tab.on{ color:var(--green); }
.ad-tab.on::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--green); }

.ad-warn{ background:#FFF6E8; border-bottom:1px solid #F0DFC0; color:#7A5312;
  font-size:var(--t-base); }
.ad-warn .w{ padding:var(--s4) var(--gutter); line-height:1.8; }
.ad-warn b{ color:#5C3D0B; }
#ad-dirty{ background:var(--green-bg); border-bottom:1px solid #D4E0D6; color:var(--green); }
#ad-dirty .w{ padding:var(--s3) var(--gutter); font-size:var(--t-base); font-weight:600; }

main{ padding:var(--s7) 0 var(--s10); }
.ad-bar{ display:flex; align-items:center; justify-content:space-between; gap:var(--s4);
  margin-bottom:var(--s5); flex-wrap:wrap; }
.ad-bar-r{ display:flex; gap:var(--s2); flex-wrap:wrap; }
.ad-bad{ color:var(--red-ink); font-weight:700; }
.ad-note{ background:var(--white); border:1px solid var(--line); border-radius:var(--r);
  padding:var(--s4) var(--s5); margin-bottom:var(--s5); font-size:var(--t-base);
  color:var(--ink2); line-height:1.8; }
/* 주문을 못 받는 상태 — 운영자가 아침에 지나치면 안 되는 줄입니다 */
.ad-note-warn{ background:#FFF8F2; border-color:#E7C9A8; }
.ad-note-warn b{ color:#A8402F; }

.ad-t{ width:100%; border-collapse:collapse; background:var(--white);
  border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; font-size:var(--t-base); }
.ad-t th,.ad-t td{ padding:var(--s3) var(--s4); border-bottom:1px solid var(--line);
  text-align:left; vertical-align:middle; }
.ad-t thead th{ background:var(--ivory); font-size:var(--t-sm); color:var(--ink2); }
.ad-t .r{ text-align:right; }
.ad-t tr.bad td{ background:#FDF5F3; }
.ad-th{ width:64px; }
.ad-th img{ width:48px; height:48px; object-fit:cover; border-radius:var(--r-sm); background:var(--line-soft); }
.ad-id{ font-size:var(--t-cap); color:var(--ink3); font-family:ui-monospace,monospace; }
.ad-err{ font-size:var(--t-cap); color:var(--red-ink); margin-top:3px; }
.ad-so{ display:inline-flex; align-items:center; gap:5px; min-height:40px; margin-left:8px;
  font-size:var(--t-cap); color:var(--ink2); cursor:pointer; }
.ad-so input{ width:17px; height:17px; accent-color:var(--red); }
.ad-act{ white-space:nowrap; text-align:right; }
.ad-act button{ min-height:36px; padding:0 var(--s3); margin-left:4px; border:1px solid var(--line);
  background:var(--white); border-radius:var(--r-sm); font-size:var(--t-sm); cursor:pointer;
  font-family:var(--font); }
.ad-act button:hover{ border-color:var(--green); color:var(--green); }
.ad-act button.x:hover{ border-color:var(--red); color:var(--red-ink); }
.ad-empty{ background:var(--white); border:1px dashed var(--line); border-radius:var(--r-lg);
  padding:var(--s10); text-align:center; color:var(--ink2); }

.ad-cols{ display:grid; grid-template-columns:1fr 320px; gap:var(--s7); align-items:start; }
.ad-cols > *{ min-width:0; }
.ad-form{ background:var(--white); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:var(--s6); }
.ad-form h3{ font-size:var(--t-md); margin:var(--s6) 0 var(--s4); padding-bottom:var(--s2);
  border-bottom:1px solid var(--line); }
.ad-form h3:first-child{ margin-top:0; }
.ad-g2{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s4); }
.ad-g3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--s4); }
.ad-f{ margin-bottom:var(--s4); min-width:0; }
.ad-f label{ display:block; font-size:var(--t-sm); font-weight:600; margin-bottom:5px; }
.ad-f label em{ font-style:normal; color:var(--red-ink); font-size:var(--t-cap); }
.ad-f input,.ad-f select{ width:100%; min-height:42px; padding:9px var(--s3);
  border:1px solid var(--line); border-radius:var(--r); background:var(--white); font-size:var(--t-base); }
.ad-f input:focus,.ad-f select:focus{ border-color:var(--green); }
.ad-f small{ display:block; font-size:var(--t-cap); color:var(--ink3); margin-top:4px; line-height:1.6; }
.ad-f small.ok{ color:var(--green); font-weight:600; }
.ad-f small.no{ color:var(--red-ink); font-weight:600; }
.ad-f.need input{ border-color:#E7C9A8; background:#FFFCF6; }
.ad-ck{ display:flex; align-items:center; gap:var(--s3); min-height:44px; cursor:pointer;
  font-weight:400; font-size:var(--t-base); }
.ad-ck input{ width:20px; height:20px; min-height:0; accent-color:var(--green); }
.ad-chips{ display:flex; flex-wrap:wrap; gap:6px; }
.ad-chip{ min-height:40px; padding:0 var(--s4); border:1px solid var(--line); border-radius:var(--r-pill);
  background:var(--white); font-size:var(--t-sm); font-weight:600; color:var(--ink2);
  cursor:pointer; font-family:var(--font); }
.ad-chip:hover{ border-color:var(--green); color:var(--green); }
.ad-chip.on{ background:var(--green); border-color:var(--green); color:#fff; }
.ad-biz{ display:grid; grid-template-columns:1fr 1fr; gap:0 var(--s5); }
.ad-errs{ background:#FDF5F3; border:1px solid #EFD5CF; border-radius:var(--r);
  padding:var(--s4) var(--s5); margin-bottom:var(--s5); color:var(--red-ink); font-size:var(--t-base); }
.ad-errs ul,.ad-warns ul{ margin:var(--s2) 0 0; padding-left:20px; }
.ad-errs li,.ad-warns li{ margin-bottom:4px; }
.ad-warns{ background:#FFF9EE; border:1px solid #EFDFC2; border-radius:var(--r);
  padding:var(--s4) var(--s5); margin-bottom:var(--s5); color:#7A5312; font-size:var(--t-base); }
.ad-prev{ background:var(--white); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:var(--s5); position:sticky; top:var(--s4); }
.ad-prev h3{ font-size:var(--t-sm); color:var(--ink2); margin-bottom:var(--s4); }
.pg-1{ grid-template-columns:1fr; }
.ad-prev-n{ font-size:var(--t-cap); color:var(--ink3); margin:var(--s4) 0 0; line-height:1.7; }

/* 잠금 화면 — 풀리기 전에는 내용이 아예 안 그려집니다.
   숨기기만 하면 소스에서 그냥 보입니다. */
body.locked{ overflow:hidden; }
body.locked > header,
body.locked > nav,
body.locked > .ad-warn,
body.locked > #ad-dirty,
body.locked > main{ display:none; }
.gate{ position:fixed; inset:0; background:var(--green); display:grid; place-items:center;
  padding:var(--s5); z-index:100; }
.gate-box{ width:100%; max-width:340px; background:var(--white); border-radius:var(--r-lg);
  padding:var(--s7) var(--s6) var(--s6); box-shadow:0 20px 60px rgba(0,0,0,.28); }
.gate-box b{ display:block; font-size:19px; font-weight:800; letter-spacing:.05em;
  color:var(--green); }
.gate-box span{ display:block; font-size:var(--t-sm); color:var(--ink2); margin-bottom:var(--s6); }
.gate-box label{ display:block; font-size:var(--t-sm); font-weight:600; margin-bottom:6px; }
.gate-box input{ width:100%; min-height:46px; padding:10px var(--s4); border:1px solid var(--line);
  border-radius:var(--r); font-size:var(--t-md); margin-bottom:var(--s4); }
.gate-box input:focus{ border-color:var(--green); }
.gate-box p{ min-height:20px; margin:var(--s3) 0 0; font-size:var(--t-sm);
  color:var(--red-ink); text-align:center; }
.gate-box a{ display:block; text-align:center; font-size:var(--t-sm); color:var(--ink2);
  min-height:40px; line-height:40px; }
.gate-box a:hover{ color:var(--green); }

@media (max-width:1024px){
  .ad-cols{ grid-template-columns:1fr; }
  .ad-prev{ position:static; }
  .ad-g3,.ad-biz{ grid-template-columns:1fr 1fr; }
}
@media (max-width:640px){
  .ad-g2,.ad-g3,.ad-biz{ grid-template-columns:1fr; }
  .ad-t thead{ display:none; }
  .ad-t,.ad-t tbody,.ad-t tr,.ad-t td{ display:block; width:100%; }
  .ad-t tr{ border-bottom:1px solid var(--line); padding:var(--s3) 0; }
  .ad-t td{ border:0; padding:4px var(--s4); }
  .ad-act{ text-align:left; }
}
</style>
</head>
<body>

<header class="ad-hd"><div class="w">
  <b>ABOUTMEAT</b><span>상품 관리</span>
  <div class="sp">
    <a href="index.html" target="_blank" rel="noopener">사이트 열기</a>
  </div>
</div></header>

<nav class="ad-tabs"><div class="w">
  <button class="ad-tab on" data-t="list" onclick="adTab('list')">상품</button>
  <button class="ad-tab" data-t="biz" onclick="adTab('biz')">사업자 정보</button>
</div></nav>

<!-- ⚠️ 이 안내를 지우지 마세요. 여기서 고친다고 사이트가 바뀌지 않는다는
     것을 모르면, 상품을 잔뜩 넣어 놓고 사이트는 그대로인 일이 생깁니다. -->
<div class="ad-warn"><div class="w">
  <b>이 화면은 파일을 만들어 주는 도구입니다.</b> 여기서 고친 내용은 이 브라우저에만 남습니다 —
  사이트에 반영하려면 <b>파일 내보내기</b> 를 누른 뒤, 받은 파일로
  <code>js/data/products.js</code>(사업자 정보는 <code>js/data/site.js</code>)를 덮어쓰고 올려야 합니다.
</div></div>
<div id="ad-dirty" hidden><div class="w">아직 파일로 내보내지 않은 변경이 있습니다.</div></div>

<main><div class="w" id="ad-view"></div></main>

<!-- 잠금이 먼저 돌아야 합니다. bootAdmin 은 잠금이 풀린 뒤에만 불립니다. -->
<script src="js/data/site.js"></script>
<script src="js/data/categories.js"></script>
<script src="js/data/products.js"></script>
<script src="js/data/filters.js"></script>
<script src="js/components/base.js"></script>
<script src="js/components/cards.js"></script>
<script src="js/admin.js"></script>
<script src="js/admin-ui.js"></script>
<script src="js/admin-gate.js"></script>
<script>
/* 손님 화면의 toast 는 app.js 에 있습니다. 관리자에는 app.js 를 안 싣기
   때문에(라우터가 화면을 통째로 갈아 치웁니다) 여기 작은 것 하나를 둡니다. */
var TT=null;
window.toast=function(m){
  var t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast";
    t.style.cssText="position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);"+
      "background:#202522;color:#fff;padding:13px 24px;border-radius:10px;font-size:14px;"+
      "font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;"+
      "max-width:calc(100vw - 32px);text-align:center;font-family:var(--font);";
    document.body.appendChild(t); }
  t.textContent=m; t.style.opacity="1"; t.style.transform="translate(-50%,0)";
  clearTimeout(TT); TT=setTimeout(function(){ t.style.opacity="0"; t.style.transform="translate(-50%,16px)"; },2600);
};
</script>
</body>
</html>
