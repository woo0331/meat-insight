<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>DB 점검 — 고리 운영자용</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'><circle cx='13' cy='13' r='13' fill='%23B3164C'/><path d='M7 14 C7 10 10 7 14 7 C18 7 21 10 21 14 C21 17.5 18 20 14 20 L9 20' stroke='white' stroke-width='2.5' stroke-linecap='round' fill='none'/><circle cx='8' cy='20' r='2' fill='white'/></svg>"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gn:#B3164C;--gn2:#8A0F3A;--gnl:#FDE8EF;--gnb:#F6C6D6;--gn-on-tint:#8A0F3A;
  --ink:#14181C;--ink2:#3A4149;--ink3:#5E636A;--ink4:#676C75;
  --bd:#EAE8E4;--bd2:#D9D6D0;--bg2:#F2F1ED;
  --ok:#1B7A46;--okl:#E3F5EA;--red:#B93A15;--redbg:#FBE6DC;
  --amber-tint:#FCF4E2;--amber-br:#EBD3A0;--amber-on:#6E4A08;
  --font:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
body{font-family:var(--font);background:#fff;color:var(--ink);letter-spacing:-.02em;
  -webkit-font-smoothing:antialiased;line-height:1.6;}
.w{max-width:860px;margin:0 auto;padding:40px 20px 80px;}
h1{font-size:29px;font-weight:800;letter-spacing:-.04em;margin-bottom:8px;}
.sub{font-size:15px;color:var(--ink3);font-weight:500;margin-bottom:26px;}
.card{border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:14px;}
.card h2{font-size:15px;font-weight:800;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--bd);}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:12px 0 6px;}
input[type=text]{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:9px;
  font-size:14px;font-family:var(--mono);color:var(--ink);background:#fff;}
input[type=text]:focus{outline:none;border-color:var(--gn);}
.hint{font-size:12.5px;color:var(--ink3);margin-top:6px;}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
button{min-height:50px;padding:0 22px;border-radius:12px;font-size:15px;font-weight:800;
  cursor:pointer;font-family:var(--font);border:1.5px solid var(--bd2);background:#fff;color:var(--ink2);}
button:hover:not(:disabled){border-color:var(--gn);color:var(--gn);}
button.p{background:var(--gn);border-color:var(--gn);color:#fff;}
button.p:hover:not(:disabled){background:var(--gn2);border-color:var(--gn2);color:#fff;}
button:disabled{opacity:.5;cursor:default;}
.warnbox{background:var(--amber-tint);border:1px solid var(--amber-br);border-radius:12px;
  padding:14px 16px;font-size:13.5px;color:var(--amber-on);line-height:1.7;margin-top:14px;}
.chk{display:flex;align-items:flex-start;gap:9px;margin-top:12px;font-size:14px;color:var(--ink2);cursor:pointer;}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--gn);flex-shrink:0;}
/* 긴 줄이 잘려서 안 보이면 곤란하므로 줄바꿈합니다 (복사는 원문 그대로) */
pre{background:#12161B;color:#E6E8EA;border-radius:12px;padding:18px;
  font-family:var(--mono);font-size:12.5px;line-height:1.75;margin-top:14px;
  white-space:pre-wrap;overflow-wrap:anywhere;-webkit-text-size-adjust:100%;}
pre:empty{display:none}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pill{border-radius:999px;padding:9px 16px;font-size:14px;font-weight:800;}
.pill.g{background:var(--okl);color:var(--ok);}
.pill.r{background:var(--redbg);color:var(--red);}
.pill.y{background:var(--amber-tint);color:var(--amber-on);}
:focus-visible{outline:3px solid var(--gn);outline-offset:2px;}
@media(max-width:600px){ .w{padding:26px 16px 60px} h1{font-size:24px} .acts button{flex:1} }
</style>
</head>
<body>
<div class="w">
  <h1>DB 점검</h1>
  <p class="sub">지금 연결된 Supabase 가 이 사이트 코드와 맞는지 확인합니다.
    표가 없거나 컬럼이 빠졌으면 <b>어느 SQL 을 실행해야 하는지</b> 알려 드립니다.</p>

  <div class="card">
    <h2>연결할 곳</h2>
    <label class="f" for="u">프로젝트 주소</label>
    <input type="text" id="u" spellcheck="false" autocomplete="off" placeholder="https://xxxxx.supabase.co">
    <label class="f" for="k">공개 키 (anon key)</label>
    <input type="text" id="k" spellcheck="false" autocomplete="off" placeholder="eyJhbGciOi…">
    <div class="hint" id="hint">사이트가 쓰는 값이 자동으로 채워집니다. 그대로 두시면 됩니다.</div>

    <label class="chk" for="wr">
      <input type="checkbox" id="wr">
      <span><b>쓰기·삭제까지 확인</b> — 표시용 행을 하나 넣고 바로 지웁니다.
        공개 키로 삭제가 되면 <b>남의 요청도 아무나 지울 수 있다</b>는 뜻이라
        이걸 켜야 확인됩니다.</span>
    </label>

    <div class="acts">
      <button class="p" id="go">점검 시작</button>
      <button id="copy" disabled>결과 복사</button>
    </div>
    <div class="sum" id="sum"></div>
  </div>

  <pre id="out"></pre>

  <div class="warnbox">
    이 페이지는 표를 만들지 않습니다. <code>db/phase2 → phase3 → phase4 → phase5</code> 는
    Supabase → SQL Editor 에서 직접 실행해야 합니다 (공개 키로는 표를 만들 수 없습니다).
    체크박스를 켜지 않으면 아무것도 쓰지 않습니다.
  </div>
</div>

<script src="db-expect.js"></script>
<script>
(function(){
  var EXPECT = window.GORI_DB_EXPECT || [];
  var $ = function(id){ return document.getElementById(id); };
  var out = $("out"), sum = $("sum");
  var lines = [], problems = 0, warns = 0;
  function L(s){ lines.push(s); out.textContent = lines.join("\n"); }

  /* 사이트가 쓰는 값을 기본으로 채웁니다.
     index.html 에서 읽으므로 값을 두 곳에 적어 둘 필요가 없습니다.
     파일을 그냥 더블클릭해서 열면(file://) 브라우저가 이 읽기를 막습니다 —
     그때는 조용히 비워 두지 말고 무엇을 해야 하는지 알려 줍니다. */
  function autofillFailed(why){
    var h = $("hint");
    if (!h) return;
    h.innerHTML = "주소·키가 자동으로 채워지지 않았습니다" + (why ? " (" + why + ")" : "") + ".<br>" +
      "배포한 주소에서 이 페이지를 열거나, Supabase → Project Settings → API 의 " +
      "<b>Project URL</b> 과 <b>anon public</b> 키를 붙여넣어 주세요.";
    h.style.color = "var(--amber-on)";
  }
  try {
    /* 관리 화면에서 다른 프로젝트를 저장해 뒀으면 그 값이 우선입니다 (index.html 과 같은 규칙) */
    var saved = JSON.parse(localStorage.getItem("gori_sb_cfg") || "null");
    if (saved && saved.url && saved.key){ $("u").value = saved.url; $("k").value = saved.key; }
  } catch(e){}
  if (!$("u").value){
    if (location.protocol === "file:") autofillFailed("파일로 직접 연 경우");
    else fetch("index.html").then(function(r){ return r.text(); }).then(function(s){
      var u = s.match(/var SU="([^"]+)"/), k = s.match(/var SK="([^"]+)"/);
      if (u && !$("u").value) $("u").value = u[1];
      if (k && !$("k").value) $("k").value = k[1];
      if (!$("u").value) autofillFailed("index.html 에서 값을 찾지 못함");
    }).catch(function(){ autofillFailed(); });
  }

  var URL_ = "", KEY = "";
  function rest(p, opt){
    opt = opt || {};
    return fetch(URL_ + p, {
      method: opt.method || "GET",
      headers: { apikey: KEY, Authorization: "Bearer " + KEY,
                 "Content-Type": "application/json", Prefer: opt.prefer || "count=exact" },
      body: opt.body ? JSON.stringify(opt.body) : undefined
    }).then(function(res){
      return res.text().then(function(text){
        var json = null;
        try { json = text ? JSON.parse(text) : null; } catch(e){}
        /* 중간에서 프록시·방화벽이 가로채고 403 을 주면 표가 있는 것처럼 보입니다.
           PostgREST 가 낸 응답인지 본문으로 가려냅니다. */
        var fromPg = !!(json && typeof json === "object" &&
          ("message" in json || "code" in json || "hint" in json || "details" in json ||
           Array.isArray(json) || "swagger" in json || "openapi" in json || "paths" in json));
        return { status: res.status, ok: res.ok, json: json, text: text,
                 fromPg: fromPg, range: res.headers.get("content-range") || "" };
      });
    }).catch(function(e){ return { status: 0, ok: false, json: null, text: String(e&&e.message||e), fromPg: false }; });
  }

  function missingColumnOf(err){
    var m = ((err && err.message) || "") + " " + ((err && err.details) || "") + " " + ((err && err.hint) || "");
    var mm = m.match(/column\s+"?([A-Za-z0-9_.]+)"?\s+does not exist/i) || m.match(/'([A-Za-z0-9_]+)'\s+column/);
    return mm ? String(mm[1]).split(".").pop() : null;
  }

  function probeColumns(table, cols){
    var left = cols.slice(), missing = [], tries = 0;
    function step(){
      if (!left.length || tries++ > cols.length + 2) return Promise.resolve({ missing: missing });
      return rest("/rest/v1/" + table + "?select=" + left.join(",") + "&limit=1").then(function(r){
        if (r.ok) return { missing: missing };
        var col = missingColumnOf(r.json);
        if (col && left.indexOf(col) >= 0){
          missing.push(col); left = left.filter(function(c){ return c !== col; });
          return step();
        }
        return { missing: missing, blocked: true };
      });
    }
    return step();
  }

  var WRITE_PROBE = {
    purchase_requests: { title: "[고리 점검] 삭제해도 되는 행", description: "db-check", status: "견적대기" },
    suppliers:         { name: "[고리 점검] 삭제해도 되는 행", region: "서울" }
  };

  function run(){
    lines = []; problems = 0; warns = 0; sum.innerHTML = ""; out.textContent = "";
    URL_ = String($("u").value || "").trim().replace(/\/+$/, "");
    KEY  = String($("k").value || "").trim();
    var doWrite = $("wr").checked;
    if (!URL_ || !KEY){ L("주소와 공개 키를 채워 주세요."); return Promise.resolve(); }

    $("go").disabled = true; $("go").textContent = "점검 중…"; $("copy").disabled = true;
    L("고리 — DB 점검  " + (doWrite ? "[쓰기까지 확인]" : "[읽기만]"));
    L("");
    L("1. 연결");
    L("   " + URL_);

    var state = {};
    return rest("/rest/v1/").then(function(r){
      if (r.status === 0){
        problems++;
        L("   ❌ 연결 실패: " + r.text);
        L("      주소가 맞는지, 이 컴퓨터에서 supabase.co 로 나갈 수 있는지 확인하세요.");
        return null;
      }
      if (!r.ok || !r.fromPg){
        problems++;
        L("   ❌ Supabase 가 아닌 응답 (HTTP " + r.status + ")");
        L("      중간에서 프록시·방화벽·VPN 이 가로챘거나 주소가 잘못됐습니다.");
        if (r.text) L("      받은 내용: " + JSON.stringify(String(r.text).slice(0,120)));
        L("      이 상태로는 표·컬럼·RLS 를 판단할 수 없어 여기서 멈춥니다.");
        return null;
      }
      L("   ✅ REST 응답 (HTTP " + r.status + ")");
      L("");
      L("2. 표와 컬럼");
      return EXPECT.reduce(function(chain, e){
        return chain.then(function(){
          return rest("/rest/v1/" + e.t + "?select=*&limit=1").then(function(h){
            var msg = (h.json && (h.json.message || h.json.hint)) || "";
            var pad = (e.t + "                      ").slice(0, 22);

            if (h.fromPg && (h.status === 404 || /PGRST205|Could not find the table|does not exist/i.test(msg + ((h.json && h.json.code) || "")))){
              state[e.t] = "missing";
              if (e.optional){ warns++; L("   ⚠️ " + pad + " 없음 — " + e.phase); }
              else { problems++; L("   ❌ " + pad + " 없음 — " + e.phase + " 를 실행하세요"); }
              return;
            }
            if (h.status === 401 || h.status === 403){
              if (!h.fromPg){ state[e.t]="intercepted"; problems++;
                L("   ❌ " + pad + " 판단 불가 — Supabase 가 아닌 곳에서 HTTP " + h.status); return; }
              state[e.t] = "blocked";
              L("   ✅ " + pad + " 있음 (공개 키 읽기 차단 — RLS 적용됨)");
              return;
            }
            if (!h.ok){ state[e.t]="error"; problems++;
              L("   ❌ " + pad + " HTTP " + h.status + " " + String(msg).slice(0,70)); return; }

            state[e.t] = "open";
            var total = (h.range.split("/")[1]) || "?";
            return probeColumns(e.t, e.must).then(function(must){
              return probeColumns(e.t, e.want).then(function(want){
                if (must.missing.length){
                  problems++;
                  L("   ❌ " + pad + " 있음(" + total + "행) — 필수 컬럼 없음: " + must.missing.join(", "));
                } else if (want.missing.length){
                  warns++;
                  L("   ⚠️ " + pad + " 있음(" + total + "행) — 선택 컬럼 없음: " + want.missing.join(", "));
                  L("      · " + e.phase + " 를 실행하면 채워집니다. 지금은 그 값만 빠진 채 저장됩니다.");
                } else {
                  L("   ✅ " + pad + " 있음(" + total + "행) — 컬럼 " + (e.must.length + e.want.length) + "개 모두 확인");
                }
              });
            });
          });
        });
      }, Promise.resolve()).then(function(){ return state; });
    }).then(function(st){
      if (!st) return;
      L("");
      L("3. RLS — 공개 키로 무엇까지 되는가");
      var readable = EXPECT.filter(function(e){ return st[e.t] === "open"; }).map(function(e){ return e.t; });
      var blocked  = EXPECT.filter(function(e){ return st[e.t] === "blocked"; }).map(function(e){ return e.t; });
      if (blocked.length) L("   ✅ 읽기 차단됨: " + blocked.join(", "));
      if (readable.length){
        L("   · 누구나 읽을 수 있는 표: " + readable.join(", "));
        L("      요청·업체·구인구직·시세는 원래 공개라 정상입니다.");
        var priv = ["notifications","chat_messages","chat_rooms","orders","quotes",
                    "verifications","admins","reports","inquiries","worker_profiles"];
        var leak = readable.filter(function(t){ return priv.indexOf(t) >= 0; });
        if (leak.length){
          problems++;
          L("   ❌ 개인 정보가 담긴 표를 누구나 읽습니다: " + leak.join(", "));
          L("      db/phase2_schema.sql · phase4_admin.sql 의 RLS 블록을 실행하세요.");
        }
      }
      if (!doWrite){
        warns++;
        L("   ⚠️ 쓰기·삭제는 확인하지 않았습니다 (위 체크박스를 켜면 실제로 시도합니다).");
        return;
      }
      L("   표시용 행을 넣고 바로 지웁니다");
      return Object.keys(WRITE_PROBE).reduce(function(chain, t){
        return chain.then(function(){
          if (st[t] !== "open") return;
          var pad = (t + "                      ").slice(0,22);
          return rest("/rest/v1/" + t, { method:"POST", body: WRITE_PROBE[t], prefer:"return=representation" })
            .then(function(ins){
              if (!ins.ok){ L("   ✅ " + pad + " 공개 키 쓰기 차단 (HTTP " + ins.status + ")"); return; }
              var row = (ins.json && ins.json[0]) || null, id = row && row.id;
              warns++;
              L("   ⚠️ " + pad + " 공개 키로 행을 넣을 수 있습니다 (로그인 없이 등록을 허용한다면 정상)");
              if (!id) return;
              return rest("/rest/v1/" + t + "?id=eq." + encodeURIComponent(id), { method:"DELETE" })
                .then(function(del){
                  if (del.ok){
                    problems++;
                    L("   ❌ " + pad + " 공개 키로 행을 지울 수 있습니다 — 남의 데이터도 지울 수 있다는 뜻입니다");
                    L("      db/phase4_admin.sql 5번 블록(RLS)을 지금 실행하세요.");
                  } else {
                    L("   ✅ " + pad + " 공개 키 삭제 차단 (HTTP " + del.status + ") — 넣은 점검용 행은 직접 지워주세요");
                  }
                });
            });
        });
      }, Promise.resolve());
    }).then(function(){
      return rest("/storage/v1/object/list/supplier-photos", { method:"POST", body:{ prefix:"", limit:1 } });
    }).then(function(r){
      if (!r) return;
      L("");
      L("4. 저장소 (업체 사진)");
      if (r.ok) L("   ✅ supplier-photos 버킷 있음");
      else if (r.status === 400 || r.status === 404){
        warns++;
        L("   ⚠️ supplier-photos 버킷을 찾지 못했습니다 (HTTP " + r.status + ")");
        L("      db/phase5_storage.sql 을 실행하거나 Supabase → Storage 에서 만드세요.");
        L("      없어도 사진만 못 올리고 업체 등록은 됩니다.");
      } else L("   · 확인 불가 (HTTP " + r.status + ")");
    }).catch(function(e){
      problems++; L("");
      L("❌ 점검 중 오류: " + (e && e.message));
    }).then(function(){
      L("");
      L("── 끝 ──");
      var g = document.createElement("span");
      if (!problems && !warns){ g.className = "pill g"; g.textContent = "✅ 전부 정상"; }
      else {
        if (problems){ var a=document.createElement("span"); a.className="pill r";
          a.textContent="❌ 문제 " + problems + "건"; sum.appendChild(a); }
        g.className = "pill y"; g.textContent = "⚠️ 확인 필요 " + warns + "건";
        if (!warns) g = null;
      }
      if (g) sum.appendChild(g);
      $("go").disabled = false; $("go").textContent = "다시 점검";
      $("copy").disabled = false;
    });
  }

  $("go").addEventListener("click", run);
  $("copy").addEventListener("click", function(){
    var t = out.textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){
      $("copy").textContent = "복사했습니다";
      setTimeout(function(){ $("copy").textContent = "결과 복사"; }, 1600);
    }).catch(function(){
      var r = document.createRange(); r.selectNodeContents(out);
      var s = getSelection(); s.removeAllRanges(); s.addRange(r);
      $("copy").textContent = "선택했습니다 — Ctrl+C";
      setTimeout(function(){ $("copy").textContent = "결과 복사"; }, 2200);
    });
  });
})();
</script>
</body>
</html>
