<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 브라우저가 색을 뒤집는 것을 막습니다 (안드로이드 크롬 · 삼성 인터넷의
     자동 다크 모드). 메타와 CSS 를 둘 다 둡니다. -->
<meta name="color-scheme" content="only light">
<!-- 준비 중인 빈 화면이 검색에 색인되지 않게 합니다. 새 서비스를 세우는 날
     이 줄을 걷어내세요. -->
<meta name="robots" content="noindex,nofollow">
<title>준비 중</title>
<style>
  :root{ color-scheme: only light; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    min-height:100vh; display:grid; place-items:center;
    padding:24px 16px;
    background:#FFFFFF; color:#231F20;
    font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",
         "Malgun Gothic","Noto Sans KR",sans-serif;
    word-break:keep-all; overflow-wrap:anywhere;
  }
  .b{ width:100%; max-width:420px; text-align:center; }
  h1{ margin:0 0 10px; font-size:22px; line-height:1.35; font-weight:700; }
  p{ margin:0; font-size:15px; color:#444444; }
</style>
</head>
<body>
  <main class="b">
    <h1>새 서비스를 준비하고 있습니다</h1>
    <p>조금 뒤에 다시 찾아 주세요.</p>
  </main>
</body>
</html>
