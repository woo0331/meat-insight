<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>구인구직 관리 — 고리</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'><circle cx='13' cy='13' r='13' fill='%232E7D32'/><path d='M7 14 C7 10 10 7 14 7 C18 7 21 10 21 14 C21 17.5 18 20 14 20 L9 20' stroke='white' stroke-width='2.5' stroke-linecap='round' fill='none'/><circle cx='8' cy='20' r='2' fill='white'/></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Noto Sans KR",sans-serif;background:#F5F2EC;color:#1A1A1A;-webkit-font-smoothing:antialiased;}
:root{
  --gn:#2E7D32;--gn2:#165E20;--gnl:#E8F5E9;
  --bg:#F5F2EC;--bg2:#FAF8F4;--bd:#E0DAD0;--bd2:#C8BFB2;
  --ink:#1A1A1A;--ink2:#3D3D3D;--ink3:#6B6B6B;--ink4:#9E9E9E;
  --red:#C62828;--redbg:#FFEBEE;--blue:#1565C0;--bluebg:#E3F2FD;
  --or:#E65100;--orl:#FFF3E0;--navy:#1A2332;--pur:#7C3AED;--purbg:#F1ECFB;
  --serif:"Noto Serif KR",serif;--max:1180px;--r:8px;
  --sh:0 2px 10px rgba(0,0,0,.07);--sh2:0 8px 30px rgba(0,0,0,.14);
}
.hdr{background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:50;}
.hdr-w{max-width:var(--max);margin:0 auto;padding:13px 22px;display:flex;align-items:center;gap:14px;}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
.logo-nm{font-size:19px;font-weight:800;color:var(--ink);font-family:var(--serif);}
.logo-nm em{color:var(--gn);font-style:normal;}
.hdr-div{width:1px;height:18px;background:var(--bd);}
.hdr-title{font-size:15px;font-weight:700;color:var(--ink2);}
.hdr-nav{display:flex;gap:4px;margin-left:6px;}
.hdr-nav a{font-size:13px;font-weight:600;color:var(--ink3);padding:6px 10px;border-radius:6px;text-decoration:none;}
.hdr-nav a:hover{background:var(--bg);color:var(--gn);}
.hdr-nav a.on{background:var(--gnl);color:var(--gn2);}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.conn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink4);}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--ink4);}
.conn.ok .conn-dot{background:var(--gn);}.conn.ok{color:var(--gn2);}
.conn.err .conn-dot{background:var(--red);}.conn.err{color:var(--red);}
.gear{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink3);background:none;border:1px solid var(--bd);border-radius:7px;padding:7px 11px;cursor:pointer;font-family:inherit;}
.gear:hover{border-color:var(--gn);color:var(--gn);}
.wrap{max-width:var(--max);margin:0 auto;padding:22px;}
.banner{background:#FFF8E1;border:1px solid #F0E0A0;border-radius:var(--r);padding:13px 16px;margin-bottom:16px;display:none;align-items:center;gap:12px;font-size:13px;color:#7A5C00;}
.banner.on{display:flex;}.banner b{color:#5A4400;}.banner button{margin-left:auto;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.stat{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:15px 17px;}
.stat-v{font-size:24px;font-weight:900;color:var(--ink);line-height:1;}
.stat-l{font-size:12px;color:var(--ink3);margin-top:6px;font-weight:600;}
.stat.act{border-left:3px solid var(--gn);}
.stat.hire{border-left:3px solid var(--gn2);}
.stat.seek{border-left:3px solid var(--pur);}
.stat.urg{border-left:3px solid var(--red);}
.toolbar{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:13px 15px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.search{flex:1;min-width:170px;position:relative;}
.search input{width:100%;padding:9px 12px 9px 34px;border:1.5px solid var(--bd);border-radius:7px;font-size:14px;font-family:inherit;outline:none;}
.search input:focus{border-color:var(--gn);}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);}
.fsel{padding:9px 12px;border:1.5px solid var(--bd);border-radius:7px;font-size:13px;font-family:inherit;color:var(--ink2);background:#fff;cursor:pointer;outline:none;}
.fsel:focus{border-color:var(--gn);}
.btn{padding:9px 17px;border:none;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;}
.btn-gn{background:var(--gn);color:#fff;box-shadow:0 2px 8px rgba(46,125,50,.28);}
.btn-gn:hover{background:var(--gn2);}
.btn-pur{background:var(--pur);color:#fff;box-shadow:0 2px 8px rgba(124,58,237,.28);}
.btn-pur:hover{background:#6D28D9;}
.btn-wh{background:#fff;color:var(--ink2);border:1.5px solid var(--bd2);}
.btn-wh:hover{border-color:var(--gn);color:var(--gn);}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px;}
.btn-ghost{background:none;border:1px solid var(--bd);color:var(--ink3);}
.btn-ghost:hover{border-color:var(--gn);color:var(--gn);}
.btn-danger{background:none;border:1px solid #F0C0C0;color:var(--red);}
.btn-danger:hover{background:var(--redbg);}
.list-card{background:#fff;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;}
.lrow{display:grid;grid-template-columns:74px 1fr 150px 110px 88px 118px;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--bg);font-size:13px;}
.lrow.head{background:var(--bg2);font-size:11px;font-weight:800;color:var(--ink4);letter-spacing:.3px;}
.lrow:last-child{border-bottom:none;}
.lrow.item:hover{background:var(--bg2);}
.r-role{font-weight:700;color:var(--ink);}
.r-sub{font-size:11px;color:var(--ink4);margin-top:1px;}
.r-pay{font-weight:800;color:var(--gn);white-space:nowrap;}
.r-loc::before{content:"📍 ";}
.r-actions{display:flex;gap:5px;justify-content:flex-end;}
.kind{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:5px;white-space:nowrap;}
.k-hire{background:var(--gnl);color:var(--gn2);}
.k-seek{background:var(--purbg);color:var(--pur);}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;margin-right:3px;}
.t-emp{background:var(--bg);color:var(--ink3);}
.t-urg{background:var(--redbg);color:var(--red);}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.st-dot{width:6px;height:6px;border-radius:50%;}
.st-open{background:var(--gnl);color:var(--gn2);}.st-open .st-dot{background:var(--gn);}
.st-closed{background:#EEE;color:var(--ink3);}.st-closed .st-dot{background:var(--ink4);}
.state{padding:60px 20px;text-align:center;color:var(--ink4);}
.state-ico{font-size:34px;margin-bottom:12px;opacity:.5;}
.state-t{font-size:15px;font-weight:700;color:var(--ink3);margin-bottom:5px;}
.state-d{font-size:13px;color:var(--ink4);max-width:460px;margin:0 auto;line-height:1.6;}
.spinner{width:30px;height:30px;border:3px solid var(--bd);border-top-color:var(--gn);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}
.dim{position:fixed;inset:0;background:rgba(26,35,50,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
.dim.on{display:flex;}
.modal{background:#fff;border-radius:12px;width:100%;max-width:540px;box-shadow:var(--sh2);animation:up .22s cubic-bezier(.2,.8,.3,1);}
@keyframes up{from{transform:translateY(12px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-hd{padding:18px 22px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;}
.modal-hd h2{font-size:17px;font-weight:800;}
.modal-x{font-size:20px;color:var(--ink4);border:none;background:none;cursor:pointer;line-height:1;}
.modal-bd{padding:20px 22px;}
.modal-ft{padding:15px 22px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;}
.fl{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:5px;display:block;}
.fl .req{color:var(--red);}
.fhint{font-size:11px;color:var(--ink4);margin:-7px 0 13px;line-height:1.5;}
.fhint a{color:var(--gn);font-weight:600;}
.fi{width:100%;padding:10px 12px;border:1.5px solid var(--bd);border-radius:7px;font-size:14px;font-family:inherit;color:var(--ink);outline:none;margin-bottom:13px;background:#fff;}
.fi:focus{border-color:var(--gn);}
.fi.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;}
textarea.fi{resize:vertical;min-height:70px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-err{border-color:var(--red)!important;}
.seg{display:flex;gap:6px;margin-bottom:16px;}
.seg button{flex:1;padding:10px;border:1.5px solid var(--bd);border-radius:8px;font-size:14px;font-weight:700;background:#fff;color:var(--ink3);cursor:pointer;font-family:inherit;}
.seg button.on{background:var(--pur);color:#fff;border-color:var(--pur);}
.seg button.on.hire-on{background:var(--gn);border-color:var(--gn);}
.toggle{display:flex;align-items:center;gap:9px;margin-bottom:13px;cursor:pointer;user-select:none;}
.tg-track{width:42px;height:24px;background:var(--bd2);border-radius:999px;position:relative;transition:background .18s;flex-shrink:0;}
.tg-track.on{background:var(--red);}
.tg-knob{position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.tg-track.on .tg-knob{transform:translateX(18px);}
.tg-label{font-size:14px;font-weight:600;color:var(--ink2);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:600;z-index:200;opacity:0;transition:all .25s;box-shadow:var(--sh2);pointer-events:none;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{background:var(--gn2);}.toast.err{background:var(--red);}
@media(max-width:900px){
  .stats{grid-template-columns:1fr 1fr;}
  .lrow{grid-template-columns:1fr;gap:6px;padding:14px 16px;}
  .lrow.head{display:none;}
  .cell-label{font-size:10px;font-weight:800;color:var(--ink4);text-transform:uppercase;margin-right:6px;}
  .r-actions{justify-content:flex-start;margin-top:4px;}
  .hdr-title,.hdr-nav{display:none;}
}

/* ══ 고리 통합 헤더 ══ */
.ghdr{position:sticky;top:0;z-index:60;background:#fff;box-shadow:0 1px 0 var(--bd);}
.ghdr-top{background:var(--navy);height:30px;display:flex;align-items:center;}
.ghdr-top-w{max-width:var(--max);margin:0 auto;padding:0 22px;width:100%;display:flex;align-items:center;justify-content:space-between;}
.ght-brand{font-size:11px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:.3px;}
.ght-links{display:flex;gap:14px;}
.ght-links a{font-size:11px;color:rgba(255,255,255,.45);text-decoration:none;transition:color .15s;}
.ght-links a:hover{color:rgba(255,255,255,.85);}
.ghdr-main{height:58px;display:flex;align-items:center;}
.ghdr-main-w{max-width:var(--max);margin:0 auto;padding:0 22px;width:100%;display:flex;align-items:center;gap:20px;}
.ghdr-nav{display:flex;gap:2px;}
.ghdr-nav a{font-size:14px;font-weight:600;color:var(--ink2);padding:0 14px;height:58px;display:flex;align-items:center;border-bottom:2px solid transparent;text-decoration:none;transition:all .15s;white-space:nowrap;}
.ghdr-nav a:hover{color:var(--gn);}
.ghdr-nav a.on{color:var(--gn);border-color:var(--gn);font-weight:700;}
.ghdr-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
@media(max-width:760px){
  .ghdr-top{display:none;}
  .ghdr-main-w{padding:0 14px;gap:10px;overflow-x:auto;}
  .ghdr-nav a{padding:0 10px;font-size:13px;}
}

</style>
</head>
<body>

<header class="ghdr">
  <div class="ghdr-top">
    <div class="ghdr-top-w">
      <span class="ght-brand">고리 관리자 콘솔</span>
      <div class="ght-links">
        <a href="meat_insight_main.html">🌐 고객 사이트</a>
        <a href="meat_insight_apply.html">컨설팅</a>
        <a href="meat_insight_admin.html">기존 관리자</a>
      </div>
    </div>
  </div>
  <div class="ghdr-main">
    <div class="ghdr-main-w">
      <a class="logo" href="dashboard.html" style="text-decoration:none;"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="13" fill="#2E7D32"/><path d="M7 14 C7 10 10 7 14 7 C18 7 21 10 21 14 C21 17.5 18 20 14 20 L9 20" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/><circle cx="8" cy="20" r="2" fill="white"/></svg><span class="logo-nm">고<em>리</em></span></a>
      <nav class="ghdr-nav">
        <a href="dashboard.html" class="">관리 홈</a>
        <a href="purchase_request.html" class="">견적 요청</a>
        <a href="suppliers.html" class="">공급업체</a>
        <a href="jobs.html" class="on">구인구직</a>
      </nav>
      <div class="ghdr-right">
        <div class="conn" id="conn"><span class="conn-dot"></span><span id="conn-txt">연결 확인 중…</span></div>
        <button class="gear" onclick="openSettings()">⚙ 연결 설정</button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="banner" id="banner"><span id="banner-txt"></span><button class="btn btn-sm btn-gn" onclick="openSettings()">연결 설정 열기</button></div>

  <div class="stats">
    <div class="stat act"><div class="stat-v" id="st-total">–</div><div class="stat-l">전체 공고</div></div>
    <div class="stat hire"><div class="stat-v" id="st-hire">–</div><div class="stat-l">구인 (업체)</div></div>
    <div class="stat seek"><div class="stat-v" id="st-seek">–</div><div class="stat-l">구직 (개인)</div></div>
    <div class="stat urg"><div class="stat-v" id="st-urg">–</div><div class="stat-l">급구</div></div>
  </div>

  <div class="toolbar">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="#9E9E9E" stroke-width="1.6"/><path d="M11 11L14 14" stroke="#9E9E9E" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="text" placeholder="직무·업체·이름·지역 검색" oninput="render()"/>
    </div>
    <select class="fsel" id="fkind" onchange="render()"><option value="">전체</option><option value="hire">구인</option><option value="seek">구직</option></select>
    <select class="fsel" id="frole" onchange="render()"><option value="">전체 직무</option></select>
    <select class="fsel" id="fstat" onchange="render()"><option value="">전체 상태</option><option value="모집중">모집중</option><option value="마감">마감</option></select>
    <button class="btn btn-wh btn-sm" onclick="loadJobs()">↻ 새로고침</button>
    <button class="btn btn-pur" onclick="openForm('create')">+ 공고 등록</button>
  </div>

  <div class="list-card">
    <div class="lrow head">
      <div>구분</div><div>직무 / 업체·이름</div><div>지역·고용형태</div><div>급여</div><div>상태</div><div style="text-align:right;">관리</div>
    </div>
    <div id="list"></div>
  </div>
</div>

<!-- 등록/수정 모달 -->
<div class="dim" id="dim" onclick="if(event.target.id==='dim')closeForm()">
  <div class="modal">
    <div class="modal-hd"><h2 id="m-title">새 공고</h2><button class="modal-x" onclick="closeForm()">✕</button></div>
    <div class="modal-bd">
      <div class="seg" id="m-seg">
        <button id="seg-hire" class="on hire-on" onclick="setKind('hire')">구인 (업체)</button>
        <button id="seg-seek" onclick="setKind('seek')">구직 (개인)</button>
      </div>
      <div class="row2">
        <div><label class="fl">직무 <span class="req">*</span></label><select class="fi" id="m-role"></select></div>
        <div><label class="fl">상태</label><select class="fi" id="m-status"><option>모집중</option><option>마감</option></select></div>
      </div>
      <div class="row2">
        <div><label class="fl">경력</label><select class="fi" id="m-exp"><option>신입 가능</option><option>1년 이상</option><option>3년 이상</option><option>5년 이상</option></select></div>
        <div id="wrap-emp"><label class="fl">고용형태</label><select class="fi" id="m-emp"><option>정규직</option><option>계약직</option><option>아르바이트</option></select></div>
      </div>
      <div class="row2">
        <div><label class="fl">급여</label><input class="fi" id="m-pay" placeholder="월 320만원 / 시급 13,000원"/></div>
        <div><label class="fl">지역 <span class="req">*</span></label><input class="fi" id="m-loc" placeholder="서울 강남구"/></div>
      </div>
      <div class="row2">
        <div id="wrap-company"><label class="fl" id="lbl-party">업체명 <span class="req">*</span></label><input class="fi" id="m-company" placeholder="정육점·고깃집명"/></div>
        <div><label class="fl">연락처 <span class="req">*</span></label><input class="fi" id="m-contact" placeholder="010-0000-0000"/></div>
      </div>
      <label class="fl" id="lbl-detail">추가 조건</label><textarea class="fi" id="m-detail" placeholder="4대보험, 숙소, 식사, 우대사항 등"></textarea>
      <div class="toggle" id="m-urg-toggle" onclick="toggleUrg()"><div class="tg-track" id="m-urg-track"><div class="tg-knob"></div></div><span class="tg-label">급구 표시</span></div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-wh" onclick="closeForm()">취소</button>
      <button class="btn btn-pur" id="m-save" onclick="saveJob()">등록하기</button>
    </div>
  </div>
</div>

<!-- 연결 설정 모달 -->
<div class="dim" id="dim-cfg" onclick="if(event.target.id==='dim-cfg')closeSettings()">
  <div class="modal">
    <div class="modal-hd"><h2>Supabase 연결 설정</h2><button class="modal-x" onclick="closeSettings()">✕</button></div>
    <div class="modal-bd">
      <p style="font-size:13px;color:var(--ink3);line-height:1.6;margin-bottom:16px;">본인 Supabase 프로젝트의 주소와 anon 키를 붙여넣으세요. 모든 관리 페이지가 같은 설정을 공유합니다.</p>
      <label class="fl">Project URL <span class="req">*</span></label>
      <input class="fi mono" id="cfg-url" placeholder="https://xxxxxxxx.supabase.co"/>
      <div class="fhint">Supabase → Settings → API → <b>Project URL</b>. <a href="https://supabase.com/dashboard/project/_/settings/api" target="_blank" rel="noopener">API 설정 페이지 열기 ↗</a></div>
      <label class="fl">anon public 키 <span class="req">*</span></label>
      <textarea class="fi mono" id="cfg-key" placeholder="eyJhbGciOi..." style="min-height:74px;"></textarea>
    </div>
    <div class="modal-ft">
      <button class="btn btn-wh" onclick="resetSettings()">기본값으로</button>
      <button class="btn btn-gn" onclick="saveSettings()">저장 후 연결</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var DEFAULTS={url:"https://igignylgzjphtnyxhhsd.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnaWdueWxnempwaHRueXhoaHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1MDUyMDAsImV4cCI6MjA4OTA4MTIwMH0.3u5gCw1dnG1YSmrzhN3PGVOMoQ1LBtGw0ToNhSeL42A"};
var CFG_KEY="gori_sb_cfg";
function getCfg(){try{var s=localStorage.getItem(CFG_KEY);if(s){var o=JSON.parse(s);if(o&&o.url&&o.key)return o;}}catch(e){}return DEFAULTS;}
var cfg=getCfg();var sb=null;
function buildClient(){sb=(window.supabase&&cfg.url&&cfg.key)?window.supabase.createClient(cfg.url,cfg.key):null;}
buildClient();

var TABLE="jobs";
/* 컬럼: id, kind(hire/seek), job_role, experience, employment, pay, location, company, applicant_name, contact, is_urgent, detail, status, created_at */
var ROLES=["정육사","발골사","세절기사","홀직원","주방직원","점장","가공기사","물류기사","기타"];
var rows=[];var editingId=null;var curKind="hire";var urgState=false;

function initSelects(){
  var frole=document.getElementById("frole"),mrole=document.getElementById("m-role");
  ROLES.forEach(function(r){frole.insertAdjacentHTML("beforeend","<option>"+r+"</option>");mrole.insertAdjacentHTML("beforeend","<option>"+r+"</option>");});
}

/* ── 연결 설정 ── */
function openSettings(){document.getElementById("cfg-url").value=cfg.url||"";document.getElementById("cfg-key").value=cfg.key||"";document.getElementById("dim-cfg").classList.add("on");document.body.style.overflow="hidden";}
function closeSettings(){document.getElementById("dim-cfg").classList.remove("on");document.body.style.overflow="";}
function saveSettings(){
  var url=document.getElementById("cfg-url").value.trim().replace(/\/+$/,"");
  var key=document.getElementById("cfg-key").value.trim();
  if(!/^https:\/\/.+\.supabase\.co$/.test(url)){toast("Project URL 형식 확인 (https://xxx.supabase.co)","err");return;}
  if(key.length<30){toast("anon 키를 확인해주세요.","err");return;}
  cfg={url:url,key:key};
  try{localStorage.setItem(CFG_KEY,JSON.stringify(cfg));}catch(e){toast("저장이 막혀 이번 세션만 적용됩니다.","err");}
  buildClient();closeSettings();hideBanner();toast("연결 정보를 저장했습니다.","ok");loadJobs();
}
function resetSettings(){try{localStorage.removeItem(CFG_KEY);}catch(e){}cfg=DEFAULTS;buildClient();document.getElementById("cfg-url").value=cfg.url;document.getElementById("cfg-key").value=cfg.key;toast("기본값으로 되돌렸습니다.");}
function showBanner(msg){document.getElementById("banner-txt").innerHTML=msg;document.getElementById("banner").classList.add("on");}
function hideBanner(){document.getElementById("banner").classList.remove("on");}

/* ── 조회 (READ) ── */
async function loadJobs(){
  setConn("loading","불러오는 중…");
  document.getElementById("list").innerHTML='<div class="state"><div class="spinner"></div><div class="state-d">공고를 불러오는 중…</div></div>';
  if(!sb){setConn("err","연결 안 됨");showError("연결 정보가 없습니다. 우측 상단 ‘연결 설정’을 눌러 주소·키를 입력하세요.");showBanner("<b>연결이 설정되지 않았습니다.</b>");return;}
  try{
    var res=await sb.from(TABLE).select("*").order("created_at",{ascending:false});
    if(res.error)throw res.error;
    rows=res.data||[];hideBanner();setConn("ok","연결됨 · "+rows.length+"건");render();
  }catch(e){
    setConn("err","연결 오류");var human=humanError(e);showError(human);
    if(/테이블|찾을 수 없|RLS|권한|연결|키/.test(human))showBanner("<b>"+human+"</b> (현재 주소: "+esc(cfg.url)+")");
  }
}

/* ── 렌더 ── */
function render(){
  var q=document.getElementById("q").value.trim().toLowerCase();
  var fk=document.getElementById("fkind").value,fr=document.getElementById("frole").value,fs=document.getElementById("fstat").value;
  var hire=0,seek=0,urg=0;
  rows.forEach(function(r){if(r.kind==="seek")seek++;else hire++;if(r.is_urgent)urg++;});
  document.getElementById("st-total").textContent=rows.length;
  document.getElementById("st-hire").textContent=hire;
  document.getElementById("st-seek").textContent=seek;
  document.getElementById("st-urg").textContent=urg;

  var filtered=rows.filter(function(r){
    if(fk&&(r.kind||"hire")!==fk)return false;
    if(fr&&r.job_role!==fr)return false;
    if(fs&&(r.status||"모집중")!==fs)return false;
    if(q){var hay=[r.job_role,r.company,r.applicant_name,r.location,r.pay,r.detail].join(" ").toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });

  var el=document.getElementById("list");
  if(filtered.length===0){
    el.innerHTML='<div class="state"><div class="state-ico">👷</div><div class="state-t">'+(rows.length?"조건에 맞는 공고가 없습니다":"아직 등록된 공고가 없습니다")+'</div><div class="state-d">'+(rows.length?"검색·필터를 바꿔보세요.":"우측 상단 ‘+ 공고 등록’으로 첫 구인/구직 공고를 추가하세요.")+'</div></div>';
    return;
  }
  el.innerHTML=filtered.map(rowHTML).join("");
}
function rowHTML(r){
  var seek=(r.kind==="seek");
  var kind=seek?'<span class="kind k-seek">구직</span>':'<span class="kind k-hire">구인</span>';
  var party=seek?(r.applicant_name||"이름 없음"):(r.company||"업체 미상");
  var partyLbl=seek?"구직자":"업체";
  var exp=r.experience?(" · "+esc(r.experience)):"";
  var emp=r.employment?('<span class="tag t-emp">'+esc(r.employment)+'</span>'):'';
  var urg=r.is_urgent?'<span class="tag t-urg">급구</span>':'';
  var st=(r.status==="마감")?["st-closed","마감"]:["st-open","모집중"];
  return '<div class="lrow item">'
    +'<div><span class="cell-label">구분</span>'+kind+'</div>'
    +'<div><span class="cell-label">직무</span><span class="r-role">'+(esc(r.job_role)||"–")+urg+'</span><div class="r-sub">'+partyLbl+' '+esc(party)+exp+'</div></div>'
    +'<div><span class="cell-label">근무</span><span class="r-loc">'+(esc(r.location)||"–")+'</span><div style="margin-top:3px;">'+emp+'</div></div>'
    +'<div><span class="cell-label">급여</span><span class="r-pay">'+(esc(r.pay)||"–")+'</span></div>'
    +'<div><span class="cell-label">상태</span><span class="st '+st[0]+'"><span class="st-dot"></span>'+st[1]+'</span></div>'
    +'<div class="r-actions"><button class="btn btn-sm btn-ghost" onclick="openForm(\'edit\',\''+r.id+'\')">수정</button><button class="btn btn-sm btn-danger" onclick="deleteJob(\''+r.id+'\')">삭제</button></div>'
    +'</div>';
}

/* ── 폼 ── */
function setKind(k){
  curKind=k;
  document.getElementById("seg-hire").classList.toggle("on",k==="hire");
  document.getElementById("seg-hire").classList.toggle("hire-on",k==="hire");
  document.getElementById("seg-seek").classList.toggle("on",k==="seek");
  document.getElementById("lbl-party").innerHTML=(k==="seek"?"이름":"업체명")+' <span class="req">*</span>';
  document.getElementById("m-company").placeholder=(k==="seek"?"홍길동":"정육점·고깃집명");
  document.getElementById("wrap-emp").style.display=(k==="seek"?"none":"block");
  document.getElementById("lbl-detail").textContent=(k==="seek"?"자기소개":"추가 조건");
  document.getElementById("m-detail").placeholder=(k==="seek"?"경력, 특기, 희망 근무조건 등":"4대보험, 숙소, 식사, 우대사항 등");
  document.getElementById("m-urg-toggle").style.display=(k==="seek"?"none":"flex");
}
function toggleUrg(){urgState=!urgState;document.getElementById("m-urg-track").classList.toggle("on",urgState);}
function openForm(mode,id){
  editingId=(mode==="edit")?id:null;
  var v={kind:"hire",job_role:ROLES[0],experience:"신입 가능",employment:"정규직",pay:"",location:"",company:"",applicant_name:"",contact:"",detail:"",status:"모집중",is_urgent:false};
  if(mode==="edit"){var r=rows.find(function(x){return String(x.id)===String(id);});if(r)v=Object.assign(v,r);}
  setKind(v.kind||"hire");
  document.getElementById("m-title").textContent=mode==="edit"?"공고 수정":"새 공고";
  document.getElementById("m-save").textContent=mode==="edit"?"수정 저장":"등록하기";
  document.getElementById("m-role").value=v.job_role||ROLES[0];
  document.getElementById("m-status").value=v.status||"모집중";
  document.getElementById("m-exp").value=v.experience||"신입 가능";
  document.getElementById("m-emp").value=v.employment||"정규직";
  document.getElementById("m-pay").value=v.pay||"";
  document.getElementById("m-loc").value=v.location||"";
  document.getElementById("m-company").value=(v.kind==="seek"?(v.applicant_name||""):(v.company||""));
  document.getElementById("m-contact").value=v.contact||"";
  document.getElementById("m-detail").value=v.detail||"";
  urgState=!!v.is_urgent;document.getElementById("m-urg-track").classList.toggle("on",urgState);
  clearErr();document.getElementById("dim").classList.add("on");document.body.style.overflow="hidden";
}
function closeForm(){document.getElementById("dim").classList.remove("on");document.body.style.overflow="";editingId=null;}
function clearErr(){["m-company","m-loc","m-contact"].forEach(function(i){document.getElementById(i).classList.remove("field-err");});}

/* ── 등록(CREATE) / 수정(UPDATE) ── */
async function saveJob(){
  var party=document.getElementById("m-company").value.trim();
  var loc=document.getElementById("m-loc").value.trim();
  var contact=document.getElementById("m-contact").value.trim();
  clearErr();var bad=false;
  if(!party){document.getElementById("m-company").classList.add("field-err");bad=true;}
  if(!loc){document.getElementById("m-loc").classList.add("field-err");bad=true;}
  if(!contact){document.getElementById("m-contact").classList.add("field-err");bad=true;}
  if(bad){toast((curKind==="seek"?"이름":"업체명")+"·지역·연락처는 필수입니다.","err");return;}
  if(!sb){toast("먼저 연결 설정을 완료하세요.","err");openSettings();return;}
  var payload={
    kind:curKind,
    job_role:document.getElementById("m-role").value,
    experience:document.getElementById("m-exp").value,
    employment:(curKind==="seek")?null:document.getElementById("m-emp").value,
    pay:document.getElementById("m-pay").value.trim()||null,
    location:loc,
    company:(curKind==="seek")?null:party,
    applicant_name:(curKind==="seek")?party:null,
    contact:contact,
    detail:document.getElementById("m-detail").value.trim()||null,
    status:document.getElementById("m-status").value,
    is_urgent:(curKind==="seek")?false:urgState
  };
  var btn=document.getElementById("m-save");btn.disabled=true;btn.textContent="저장 중…";
  try{
    var res=editingId
      ? await sb.from(TABLE).update(payload).eq("id",editingId)
      : await sb.from(TABLE).insert(payload);
    if(res.error)throw res.error;
    toast(editingId?"공고를 수정했습니다.":"새 공고를 등록했습니다.","ok");closeForm();await loadJobs();
  }catch(e){toast(humanError(e),"err");}
  finally{btn.disabled=false;btn.textContent=editingId?"수정 저장":"등록하기";}
}

/* ── 삭제(DELETE) ── */
async function deleteJob(id){
  var r=rows.find(function(x){return String(x.id)===String(id);});
  var label=r?((r.kind==="seek"?r.applicant_name:r.company)||r.job_role||"이 공고"):"이 공고";
  if(!confirm("‘"+label+"’ 공고를 삭제할까요?\n되돌릴 수 없습니다."))return;
  if(!sb){toast("먼저 연결 설정을 완료하세요.","err");return;}
  try{var res=await sb.from(TABLE).delete().eq("id",id);if(res.error)throw res.error;toast("공고를 삭제했습니다.","ok");await loadJobs();}
  catch(e){toast(humanError(e),"err");}
}

/* ── 유틸 ── */
function setConn(state,txt){var el=document.getElementById("conn");el.className="conn"+(state==="ok"?" ok":state==="err"?" err":"");document.getElementById("conn-txt").textContent=txt;}
function showError(msg){document.getElementById("list").innerHTML='<div class="state"><div class="state-ico">⚠️</div><div class="state-t">데이터를 불러오지 못했습니다</div><div class="state-d">'+esc(msg)+'</div></div>';}
function humanError(e){
  var m=(e&&e.message)||String(e);
  if(/Failed to fetch|NetworkError|fetch/i.test(m))return "서버에 연결하지 못했습니다. 주소·인터넷·확장프로그램을 확인하세요.";
  if(/relation .* does not exist|Could not find the table|schema cache|42P01/i.test(m))return "이 프로젝트에 jobs 테이블이 없습니다. 안내된 SQL로 테이블을 먼저 만드세요.";
  if(/row-level security|RLS|policy|401|permission/i.test(m))return "RLS 권한에 막혔습니다. anon 정책(for all)을 추가하세요.";
  if(/Invalid API key|JWT|apikey/i.test(m))return "anon 키가 올바르지 않습니다. 연결 설정에서 다시 확인하세요.";
  if(/Could not find the '(\w+)' column/i.test(m)){var c=m.match(/Could not find the '(\w+)' column/i)[1];return c+" 컬럼이 테이블에 없습니다. 안내된 SQL로 컬럼을 추가하세요.";}
  return m;
}
var toastT;
function toast(msg,type){var el=document.getElementById("toast");el.textContent=msg;el.className="toast on"+(type?" "+type:"");clearTimeout(toastT);toastT=setTimeout(function(){el.className="toast"+(type?" "+type:"");},2800);}
function esc(s){if(s==null)return"";return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeForm();closeSettings();}});

initSelects();loadJobs();
</script>
</body>
</html>
