<noscript><h1>고기 거래처를 바꾸기 전에 물어볼 것 열 가지</h1><p>단가만 비교하면 거의 손해를 봅니다. 결제조건·수율·클레임 처리까지 물어봐야 진짜 가격이 나옵니다.</p><h2>단가는 비교의 시작일 뿐입니다</h2><p>kg 단가가 500원 싸도 수율이 3% 낮으면 대개 손해입니다. 결제를 선금으로 돌려야 한다면 그만큼 운전자금이 묶입니다.</p><p>그래서 견적을 받을 때는 아래를 **같은 양식으로** 물어보셔야 나란히 놓고 볼 수 있습니다.</p><h2>반드시 물어볼 열 가지</h2><ul><li>① 단가 — 부위별로, 등급별로. &quot;한우 등심&quot; 이 아니라 &quot;한우 1++ 등심&quot;</li><li>② 등급과 이력 — 등급판정확인서를 주는가</li><li>③ 수율 — 몇 kg 을 보내면 손질 후 몇 kg 이 남는다고 보는가</li><li>④ 최소 주문량과 배송 주기 — 주 몇 회, 몇 시에 오는가</li><li>⑤ 결제조건 — 선결제인가, 외상이면 며칠인가</li><li>⑥ 단가 변동 — 시세가 오르면 언제 어떻게 알려 주는가</li><li>⑦ 클레임 — 상태가 안 좋을 때 반품·교환이 되는가, 며칠 안에</li><li>⑧ 포장 — 진공인가 박스인가, 박스값은 따로인가</li><li>⑨ 세금계산서 — 전액 발행되는가</li><li>⑩ 담당자 — 문제 생겼을 때 누구에게 전화하는가</li></ul><h2>한 번에 다 바꾸지 마세요</h2><p>새 거래처를 들일 때는 주력 부위 하나만 2~4주 먼저 받아 보시는 편이 안전합니다.</p><p>그 기간에 볼 것은 단가가 아니라 **일관성**입니다 — 같은 등급으로 계속 오는가, 약속한 시간에 오는가, 문제가 생겼을 때 어떻게 하는가.</p><h2>기존 거래처에 먼저 말씀해 보셔도 됩니다</h2><p>다른 곳 견적을 받아 보니 이렇더라, 맞춰 줄 수 있느냐고 물으면 조정되는 경우가 있습니다. 오래 거래한 곳은 바꾸는 비용도 만만치 않습니다.</p><p>다만 물어보려면 **실제 견적서**가 손에 있어야 합니다. 없이 말하면 아무 일도 일어나지 않습니다.</p><h2>원산지 표시는 바꾸는 날 같이 확인하세요</h2><p>거래처를 바꾸면 원산지가 바뀔 수 있습니다. 음식점의 육류 원산지 표시는 「농수산물의 원산지 표시 등에 관한 법률」상 의무이고, 표시가 실제와 다르면 처벌 대상입니다.</p><p>메뉴판·게시판 표시를 그날 같이 고치세요.</p></noscript>
