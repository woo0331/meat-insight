<noscript><h1>가게를 정리할 때, 순서를 지키면 덜 잃습니다</h1><p>급하게 닫으면 권리금도 장비값도 제대로 못 받습니다. 남은 계약도 그대로 따라옵니다.</p><h2>양도인가 폐업인가부터</h2><p>가게를 넘기는 것(양도)과 문을 닫는 것(폐업)은 절차도 받을 돈도 다릅니다.</p><p>양도가 가능하다면 대개 그쪽이 낫습니다. 시설과 권리금을 회수할 수 있기 때문입니다.</p><h2>임대인에게 먼저 알리세요</h2><p>「상가건물 임대차보호법」 제10조의4 는 임대인이 정당한 이유 없이 신규 임차인과의 계약을 거절해 권리금 회수를 방해하지 못하도록 하고 있습니다. 다만 요건과 기간이 정해져 있습니다.</p><p>계약 만료 전 언제 통지해야 하는지, 권리금 회수 기회를 어떻게 보호받는지는 계약서와 법 조항을 같이 보셔야 합니다.</p><h2>장비는 한꺼번에 넘기는 게 대개 낫습니다</h2><p>하나씩 팔면 값은 더 받을 수 있어도 시간이 걸리고, 그 사이 임대료가 나갑니다.</p><p>양도가 된다면 시설 일체로 넘기는 것이 가장 간단합니다.</p><ul><li>감가가 적은 것 — 냉장·냉동, 정육장비, 로스터</li><li>거의 값을 못 받는 것 — 인테리어, 간판, 소모품</li><li>리스·할부가 남아 있는 것은 **먼저 확인**하세요 — 승계인지 상환인지</li></ul><h2>계약부터 정리하세요</h2><ul><li>임대차 — 통지 시점과 원상복구 범위</li><li>리스·할부 — 잔여 기간과 중도상환 조건</li><li>POS·키오스크·인터넷·정수기 — 약정 기간과 위약금</li><li>배달 플랫폼 · 광고 상품</li><li>보험 — 해지 시점</li></ul><h2>사람과 세무</h2><ul><li>직원 — 해고 예고(「근로기준법」 제26조), 퇴직금, 4대보험 상실신고</li><li>폐업신고 — 관할 세무서 (부가가치세 확정신고 포함)</li><li>영업 폐업신고 — 관할 구청 위생과</li><li>카드 단말기·현금영수증 가맹 해지</li></ul></noscript>
