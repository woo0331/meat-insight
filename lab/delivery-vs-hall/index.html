<noscript><h1>배달을 늘리기 전에 계산해 볼 것</h1><p>매출은 느는데 돈이 안 남는 일이 생깁니다. 수수료·배달비·포장재를 빼고 봐야 합니다.</p><h2>한 건에서 실제로 남는 돈</h2><p>주문 금액에서 아래를 빼고 나서야 홀 매출과 비교할 수 있습니다.</p><ul><li>플랫폼 중개수수료</li><li>결제 수수료</li><li>배달비 중 가게 부담분</li><li>포장재비</li><li>할인·쿠폰 중 가게 부담분</li><li>광고비 (노출 상품을 쓰신다면)</li></ul><h2>고기는 배달에 불리한 품목입니다</h2><p>구워서 보내면 식고, 생고기로 보내면 손님이 구워야 합니다. 둘 다 홀에서 먹는 것과 다른 경험이 됩니다.</p><p>그래서 배달용 메뉴를 따로 설계하지 않고 홀 메뉴를 그대로 올리면, 리뷰가 먼저 나빠집니다.</p><ul><li>식어도 되는 메뉴 (찌개·덮밥·수육 등)로 구성할 수 있는가</li><li>포장 상태에서 기름·국물이 새지 않는가</li><li>홀이 바쁜 시간에 주방이 배달을 감당할 수 있는가</li></ul><h2>피크 시간이 겹치면 홀이 손해를 봅니다</h2><p>배달 한 건을 만드는 동안 홀 테이블 회전이 밀립니다. 배달 매출이 늘어도 총 이익이 줄 수 있습니다.</p><p>시작하실 때는 **홀이 한가한 시간대만** 여는 것도 방법입니다.</p><h2>그래서 뭘 보면 되나</h2><ul><li>한 달치 정산 내역서에서 실수령률을 계산한다</li><li>배달 메뉴의 재료비를 따로 잰다 (포장재 포함)</li><li>배달이 들어오는 시간대와 홀 피크가 겹치는지 본다</li><li>석 달 해 보고 총 이익이 늘었는지 본다</li></ul></noscript>
