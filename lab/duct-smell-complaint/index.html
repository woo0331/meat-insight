<noscript><h1>덕트 냄새 민원, 부르기 전에 확인할 것</h1><p>민원의 원인이 덕트가 아닌 경우가 꽤 있습니다. 무엇을 확인하고 부르느냐에 따라 견적이 몇 배 차이 납니다.</p><h2>민원이 들어오면 제일 먼저</h2><p>언제·어디서·어떤 냄새인지를 적어 두세요. 이게 있어야 업체가 원인을 좁힙니다.</p><ul><li>시간대 — 점심인가 저녁인가, 특정 요일인가</li><li>위치 — 몇 층인가, 우리 배기구에서 어느 방향인가</li><li>날씨 — 비 오는 날·바람 부는 날에 심해지는가</li><li>냄새의 종류 — 탄 냄새인가, 기름 냄새인가, 하수 냄새인가</li></ul><h2>직접 볼 수 있는 것</h2><ul><li>후드 필터 — 기름이 엉겨 있으면 흡입이 안 됩니다. 세척 주기부터</li><li>배기 팬 — 돌고 있는가, 소리가 예전과 다른가</li><li>덕트 내부 — 점검구를 열어 기름때가 얼마나 쌓였는지</li><li>배기구 위치 — 옆 건물 창문·환기구와 마주보고 있지 않은가</li><li>보충공기(급기) — 배기만 있고 들어올 공기가 없으면 흡입이 약해집니다</li></ul><h2>해결 방법은 대개 이 중 하나입니다</h2><ul><li>세척 — 필터·후드·덕트 내부 기름 제거 (제일 싸고 제일 자주 답입니다)</li><li>급기 보강 — 들어올 공기를 만들어 주는 것</li><li>배기 용량 증설 — 화구 수에 비해 팬이 작은 경우</li><li>배기구 위치 변경 — 민원 세대와 마주보는 경우</li><li>탈취 설비 — 위 네 가지로 안 될 때</li></ul><h2>법으로는 어디에 걸리나</h2><p>음식점 냄새는 「악취방지법」과 지자체 조례, 경우에 따라 「대기환경보전법」의 대상이 됩니다. 신고가 반복되면 관할 구청이 개선 권고나 명령을 내릴 수 있습니다.</p><p>권고를 받으신 상태라면 기한이 정해져 있으니, 그 기한을 업체에 먼저 알려 주셔야 일정이 맞습니다.</p><h2>견적 받을 때</h2><p>같은 조건으로 최소 두세 곳을 비교하세요. 이때 꼭 적어 보내실 것은 아래입니다.</p><ul><li>평수 · 층 · 건물 형태 (상가 몇 층인지, 옥상까지 올릴 수 있는지)</li><li>화구 수 (테이블 로스터 몇 개인지)</li><li>마지막 시공·세척이 언제였는지</li><li>민원 기록 (위에서 적어 두신 것)</li></ul></noscript>
