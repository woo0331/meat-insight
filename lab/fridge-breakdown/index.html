<noscript><h1>냉장·냉동이 안 될 때, 기사 부르기 전 5분</h1><p>5분만 보시면 출장비만 내고 끝나는 일을 줄일 수 있습니다. 그리고 고기를 살릴 수 있습니다.</p><h2>고기부터 옮기세요</h2><p>원인을 찾는 것보다 먼저입니다. 다른 냉장고·아이스박스·근처 가게 어디든 좋습니다.</p><p>냉장육은 온도가 오르면 되돌릴 수 없습니다. 수리비보다 고기값이 큰 경우가 대부분입니다.</p><h2>5분 점검</h2><ul><li>① 전원 — 차단기가 내려가 있지 않은가, 콘센트가 빠지지 않았는가</li><li>② 설정 온도 — 누가 건드리지 않았는가</li><li>③ 문 — 패킹(고무)이 삭아서 바람이 새지 않는가. 종이 한 장 끼워 당겨 보세요</li><li>④ 응축기(뒤·아래 방열판) — 먼지가 덮여 있지 않은가</li><li>⑤ 성에 — 증발기에 얼음이 두껍게 끼어 있지 않은가</li><li>⑥ 소리 — 컴프레서가 도는 소리가 나는가, 아예 조용한가</li><li>⑦ 주변 — 여름에 실외기·응축기 쪽 통풍이 막히지 않았는가</li></ul><h2>기사에게 전화할 때 알려 줄 것</h2><p>이 네 가지를 먼저 말씀하시면 부품을 가지고 옵니다. 안 그러면 보러 왔다가 다시 오게 됩니다.</p><ul><li>제조사와 모델명 (문 안쪽이나 뒷면 명판)</li><li>증상 — 아예 안 도는가, 돌긴 도는데 안 시원한가</li><li>언제부터인가</li><li>위에서 확인한 것 (성에·소리·패킹 상태)</li></ul><h2>이런 건 미리 해 두시면 덜 겪습니다</h2><ul><li>응축기 청소 — 계절마다 한 번</li><li>패킹 점검 — 반기마다</li><li>온도계를 따로 두기 — 내장 표시만 믿지 않기</li><li>숙성고·워크인은 온도 기록을 남기기</li></ul></noscript>
