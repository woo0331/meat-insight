<noscript><h1>사장님 연구소</h1><p>창업·운영·원가·고기·시설·마케팅·세무노무까지, 고기 장사에 필요한 것만 정리했습니다.</p><ul><li><a href="/lab/meat-cost-rate">육류원가율, 무엇을 세고 무엇을 빼야 하나 — 매입비를 매출로 나누면 끝이 아닙니다. 로스와 부산물을 어디에 넣느냐에 따라 같은 가게가 28%도 되고 38%도 됩니다.</a></li><li><a href="/lab/change-meat-supplier">고기 거래처를 바꾸기 전에 물어볼 것 열 가지 — 단가만 비교하면 거의 손해를 봅니다. 결제조건·수율·클레임 처리까지 물어봐야 진짜 가격이 나옵니다.</a></li><li><a href="/lab/duct-smell-complaint">덕트 냄새 민원, 부르기 전에 확인할 것 — 민원의 원인이 덕트가 아닌 경우가 꽤 있습니다. 무엇을 확인하고 부르느냐에 따라 견적이 몇 배 차이 납니다.</a></li><li><a href="/lab/fridge-breakdown">냉장·냉동이 안 될 때, 기사 부르기 전 5분 — 5분만 보시면 출장비만 내고 끝나는 일을 줄일 수 있습니다. 그리고 고기를 살릴 수 있습니다.</a></li><li><a href="/lab/open-permits">오픈 전 인허가, 빠뜨리면 문을 못 엽니다 — 인테리어가 끝났는데 영업신고가 안 나와서 오픈이 밀리는 일이 실제로 있습니다. 순서가 정해져 있습니다.</a></li><li><a href="/lab/labor-cost">인건비, 급여만 보면 실제보다 적게 보입니다 — 주휴수당·4대보험·퇴직금까지 넣어야 실제로 나가는 돈이 나옵니다. 계산이 어렵진 않습니다.</a></li><li><a href="/lab/startup-cost-missing">고깃집 창업비에서 가장 많이 빠뜨리는 칸 — 점포와 인테리어만 세고 오픈하면 두 달 뒤에 막힙니다. 빠뜨리기 쉬운 항목을 모았습니다.</a></li><li><a href="/lab/menu-margin">잘 나가는 메뉴가 남는 메뉴는 아닙니다 — 팔린 수와 남은 돈은 다릅니다. 메뉴별로 한 번만 따져 보면 어디를 손댈지 보입니다.</a></li><li><a href="/lab/delivery-vs-hall">배달을 늘리기 전에 계산해 볼 것 — 매출은 느는데 돈이 안 남는 일이 생깁니다. 수수료·배달비·포장재를 빼고 봐야 합니다.</a></li><li><a href="/lab/aging-showcase">숙성고 · 쇼케이스, 고를 때 보는 것 — 용량과 가격만 보고 사면 두 해 뒤에 바꾸게 됩니다. 실제로 보셔야 할 것은 따로 있습니다.</a></li><li><a href="/lab/second-store">2호점, 지금 내도 되는 상황인가 — 1호점이 잘된다는 것과 2호점이 잘된다는 것은 다릅니다. 내기 전에 확인할 것들.</a></li><li><a href="/lab/closing-checklist">가게를 정리할 때, 순서를 지키면 덜 잃습니다 — 급하게 닫으면 권리금도 장비값도 제대로 못 받습니다. 남은 계약도 그대로 따라옵니다.</a></li></ul></noscript>
