<noscript><h1>인건비, 급여만 보면 실제보다 적게 보입니다</h1><p>주휴수당·4대보험·퇴직금까지 넣어야 실제로 나가는 돈이 나옵니다. 계산이 어렵진 않습니다.</p><h2>실제로 나가는 돈은 급여 + 알파입니다</h2><ul><li>기본급 · 시급</li><li>주휴수당 — 1주 소정근로시간 15시간 이상이면 발생 (「근로기준법」 제55조)</li><li>연장·야간·휴일 가산 — 상시 5인 이상 사업장이면 가산율이 붙습니다</li><li>4대보험 사업주 부담분</li><li>퇴직급여 — 1년 이상 계속 근로하고 주 15시간 이상이면 발생</li><li>식대·교통비 등 실제로 주고 계신 것</li></ul><h2>인건비율은 이렇게 봅니다</h2><p>위의 합계를 그 달 매출로 나눕니다. 급여만 세면 실제보다 낮게 나오고, 그 숫자로 사람을 더 쓰시면 나중에 맞지 않습니다.</p><h2>사람이 아니라 시간을 보세요</h2><p>인건비가 높다고 사람을 줄이면 서비스가 무너지고 매출이 먼저 떨어집니다.</p><p>대개 문제는 사람 수가 아니라 **시간대 배치**입니다. 한가한 시간에 세 명이 서 있고 피크에 두 명이 뛰고 있으면, 같은 인건비로 매출이 덜 나옵니다.</p><ul><li>시간대별 매출을 한 주만 적어 보세요 (POS 에서 뽑힙니다)</li><li>그 위에 그 시간 근무 인원을 겹쳐 보세요</li><li>어긋나는 구간이 보이면 거기가 손댈 곳입니다</li></ul><h2>서류는 미리 갖춰 두세요</h2><ul><li>근로계약서 — 서면, 일 시작 전 (「근로기준법」 제17조)</li><li>임금대장·근로시간 기록</li><li>4대보험 취득·상실 신고를 제때</li></ul></noscript>
