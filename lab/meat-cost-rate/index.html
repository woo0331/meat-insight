<noscript><h1>육류원가율, 무엇을 세고 무엇을 빼야 하나</h1><p>매입비를 매출로 나누면 끝이 아닙니다. 로스와 부산물을 어디에 넣느냐에 따라 같은 가게가 28%도 되고 38%도 됩니다.</p><h2>먼저, 원가율은 하나가 아닙니다</h2><p>같은 가게에서도 세 가지 숫자가 나옵니다. 어느 것을 보고 계신지부터 정하셔야 비교가 됩니다.</p><ul><li>육류원가율 — 육류 매입비 ÷ 매출</li><li>식재료원가율 — 육류에 부재료·소스·야채를 더한 것 ÷ 매출</li><li>메뉴별 원가율 — 그 메뉴 한 접시의 재료비 ÷ 판매가</li></ul><h2>매입비에 들어가야 하는 것</h2><p>세금계산서에 찍힌 금액만 세면 실제보다 낮게 나옵니다.</p><ul><li>박스값·배송비를 따로 받는 거래처가 있습니다</li><li>현금 매입분이 장부에서 빠져 있는 경우</li><li>직원 식사용으로 나간 고기</li><li>시식·서비스로 나간 고기</li><li>폐기한 고기</li></ul><h2>로스를 빼면 숫자가 달라집니다</h2><p>10kg 을 받아 손질하면 10kg 이 팔리지 않습니다. 지방·뼈·자투리를 덜어내고 남는 양이 실제로 파는 양입니다.</p><p>이걸 세지 않으면 kg 단가만 보고 거래처를 고르게 됩니다. 단가가 싼데 수율이 낮으면 비싼 거래처입니다.</p><h2>자투리와 부산물을 어디에 넣느냐</h2><p>손질하고 남은 것을 육수·직원식·서비스로 쓰면 그만큼 비용이 줄어든 것인데, 대부분 아무 데도 안 적힙니다.</p><p>반대로 버리면 그건 온전히 손실입니다. 어느 쪽인지에 따라 같은 가게 원가율이 몇 퍼센트씩 움직입니다.</p><h2>그래서 뭘 하면 되나</h2><p>한 달치를 이 순서로 한 번만 정리해 보시면 그 다음부터는 매달 10분이면 됩니다.</p><ul><li>① 그 달 육류 매입 총액을 빠짐없이 더합니다 (현금분·배송비 포함)</li><li>② 그 달 매출을 봅니다 (부가세 제외 기준으로 통일)</li><li>③ 나눕니다 — 이게 육류원가율입니다</li><li>④ 같은 방식으로 석 달을 재 보고 추세를 봅니다</li></ul></noscript>
