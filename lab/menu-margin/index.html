<noscript><h1>잘 나가는 메뉴가 남는 메뉴는 아닙니다</h1><p>팔린 수와 남은 돈은 다릅니다. 메뉴별로 한 번만 따져 보면 어디를 손댈지 보입니다.</p><h2>두 가지를 같이 봐야 합니다</h2><p>이 둘을 겹쳐 놓으면 메뉴가 네 갈래로 나뉩니다.</p><ul><li>**얼마나 팔리는가** — 판매 수량</li><li>**한 접시에 얼마가 남는가** — 판매가 − 재료비</li></ul><h2>많이 팔리는데 안 남는 메뉴</h2><p>여기가 제일 위험합니다. 바쁜데 돈이 안 되는 상태입니다.</p><p>값을 올리거나, 원가를 낮추거나(부위·수율·거래처), 구성을 바꾸거나(양·사이드), 아니면 다른 메뉴로 유도해야 합니다.</p><h2>적게 팔리는데 많이 남는 메뉴</h2><p>메뉴판 위치·사진·설명·추천으로 팔리는 수를 늘리면 바로 이익이 됩니다. 원가를 건드릴 필요가 없습니다.</p><h2>재료비를 셀 때 빠뜨리는 것</h2><ul><li>밑반찬과 쌈·야채 — 무한리필이면 특히</li><li>소스·양념</li><li>포장재 (배달·포장 비중이 있으면)</li><li>로스 — 손질하고 버리는 부분</li><li>서비스로 나가는 것</li></ul><h2>한 번만 하면 됩니다</h2><p>메뉴 전부를 할 필요는 없습니다. 매출의 8할을 차지하는 상위 몇 개만 해 보시면 대부분 답이 나옵니다.</p><p>POS 에서 지난달 메뉴별 판매 수량을 뽑고, 그중 위에서부터 다섯 개만 재료비를 적어 보세요.</p></noscript>
