<noscript><h1>오픈 전 인허가, 빠뜨리면 문을 못 엽니다</h1><p>인테리어가 끝났는데 영업신고가 안 나와서 오픈이 밀리는 일이 실제로 있습니다. 순서가 정해져 있습니다.</p><h2>순서가 중요합니다</h2><p>아래는 대체로 이 순서로 움직입니다. 뒤엣것이 앞엣것의 서류를 요구하기 때문입니다.</p><ul><li>① 위생교육 이수 — 영업신고 **전에** 받아야 합니다</li><li>② (해당하면) 소방·다중이용업 안전시설 완비증명</li><li>③ 영업신고 — 관할 구청 위생과</li><li>④ 사업자등록 — 관할 세무서 (영업신고증이 필요합니다)</li><li>⑤ 간판 — 옥외광고물 허가·신고</li><li>⑥ 4대보험 사업장 성립신고 — 사람을 쓰신다면</li></ul><h2>식품접객업 영업신고</h2><p>일반음식점은 「식품위생법」 제37조에 따라 관할 구청에 **신고**합니다. 시설 기준이 맞아야 나오므로, 인테리어 도면 단계에서 위생과에 한 번 문의하시는 편이 안전합니다.</p><p>정육점을 같이 하시면 「축산물 위생관리법」상 축산물판매업 신고가 따로 필요합니다. 식당과 판매업은 다른 법입니다.</p><h2>위생교육</h2><p>「식품위생법」 제41조에 따라 영업자는 위생교육을 받아야 합니다. 신규 영업자는 영업을 시작하기 전에 받습니다.</p><p>업종별 협회(한국외식업중앙회 등)에서 온라인·집합으로 진행합니다.</p><h2>소방 · 다중이용업</h2><p>면적과 층, 업종에 따라 「다중이용업소의 안전관리에 관한 특별법」 대상이 될 수 있습니다. 대상이면 안전시설 등 완비증명서가 영업신고에 필요합니다.</p><p>지하층이거나 2층 이상, 면적이 일정 규모를 넘으면 해당될 가능성이 높습니다.</p><h2>간판</h2><p>「옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 법률」에 따라 간판은 허가 또는 신고 대상입니다. 크기·개수·돌출 여부에 따라 달라집니다.</p><p>간판 업체가 대행해 주는 경우가 많지만, 신고 주체는 사장님입니다. 대행을 맡기셔도 접수증은 받아 두세요.</p><h2>사람을 쓰신다면</h2><ul><li>근로계약서 — 서면으로, 일 시작 전에 (「근로기준법」 제17조)</li><li>4대보험 사업장 성립신고</li><li>최저임금 확인 — 매년 고시됩니다</li><li>주휴수당 — 1주 소정근로시간이 15시간 이상이면 발생합니다 (「근로기준법」 제55조)</li></ul></noscript>
