<noscript><h1>2호점, 지금 내도 되는 상황인가</h1><p>1호점이 잘된다는 것과 2호점이 잘된다는 것은 다릅니다. 내기 전에 확인할 것들.</p><h2>1호점이 사장님 없이 도는가</h2><p>이게 첫 번째 조건입니다. 사장님이 하루 빠지면 매출이 눈에 띄게 떨어지는 가게라면, 2호점을 내는 순간 두 곳 다 흔들립니다.</p><p>&quot;내가 없어도 되는가&quot; 를 실제로 일주일 빠져 보고 확인하시는 분들이 있습니다. 좋은 방법입니다.</p><ul><li>레시피와 손질 기준이 사람 머릿속이 아니라 문서로 있는가</li><li>발주·마감을 다른 사람이 할 수 있는가</li><li>문제가 생겼을 때 판단할 사람이 있는가</li></ul><h2>돈이 아니라 현금흐름을 보세요</h2><p>2호점 창업비를 마련했다고 되는 게 아닙니다. 새 가게가 자리 잡을 때까지 **두 곳의 고정비**를 동시에 버텨야 합니다.</p><p>1호점의 여유 현금으로 2호점 적자를 메우는 기간이 얼마나 되는지부터 계산해 보세요.</p><h2>무엇을 복제할 것인가</h2><p>1호점이 잘되는 이유가 무엇인지 정확히 모르면 복제할 수 없습니다.</p><ul><li>자리 때문인가 (그러면 그 자리를 다시 찾아야 합니다)</li><li>메뉴·맛 때문인가 (그러면 사람을 가르쳐야 합니다)</li><li>사장님 때문인가 (그러면 두 곳에 있을 수 없습니다)</li><li>가격 때문인가 (그러면 원가 구조를 그대로 가져가야 합니다)</li></ul><h2>먼저 해 볼 수 있는 것들</h2><p>2호점 말고도 매출을 늘리는 길이 있습니다. 대개 더 싸고 덜 위험합니다.</p><ul><li>지금 가게의 회전율·객단가 올리기</li><li>안 쓰는 시간대 열기 (점심 · 심야)</li><li>포장·배달 (겹치지 않는 시간대로)</li><li>정육 판매 겸업 (설비와 인허가가 추가로 필요합니다)</li><li>온라인 판매 · OEM</li></ul></noscript>
