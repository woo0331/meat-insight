<noscript><h1>고깃집 창업비에서 가장 많이 빠뜨리는 칸</h1><p>점포와 인테리어만 세고 오픈하면 두 달 뒤에 막힙니다. 빠뜨리기 쉬운 항목을 모았습니다.</p><h2>금액을 알려 드리지 않는 이유</h2><p>같은 40평이라도 지역·층·기존 점포 상태·시공 수준에 따라 항목마다 몇 배씩 차이 납니다. 근거 없는 평균값을 적어 드리면 그 숫자로 대출을 받으러 가시게 됩니다.</p><p>그래서 이 글은 **금액 대신 빠뜨리는 칸**을 알려 드립니다. 실제 금액은 견적으로 채우셔야 합니다.</p><h2>제일 많이 빠지는 것 — 운전자금</h2><p>문을 열고 손님이 자리 잡을 때까지 버틸 돈입니다. 임대료·인건비·재료비·공과금이 매달 나가는데 매출은 아직 안 찹니다.</p><p>여기를 안 잡고 시작하면, 장사가 안 돼서가 아니라 **버틸 돈이 없어서** 문을 닫게 됩니다.</p><h2>그 다음으로 잘 빠지는 것들</h2><ul><li>철거비 — 기존 점포를 받으면 뜯어내는 값이 따로 듭니다</li><li>전기 증설 — 고깃집은 용량이 큽니다. 한전 불입금이 별도로 나옵니다</li><li>급배수 공사 — 주방 위치를 바꾸면 크게 늡니다</li><li>덕트 — 화구 수에 따라 달라지고, 옥상까지 올려야 하면 더 듭니다</li><li>테이블 로스터 — 좌석 수 × 단가. 배기 방식(하향·상향)에 따라 다릅니다</li><li>초도 육류·식자재 — 첫 발주분은 대개 현금입니다</li><li>간판 신고 · 소방 · 인허가 비용</li><li>POS·키오스크·CCTV·인터넷 설치와 월 이용료</li><li>보증보험·화재보험</li><li>부가세 — 매입세액 공제 시점과 실제 지출 시점이 다릅니다</li></ul><h2>권리금은 따로 보셔야 합니다</h2><p>권리금은 시설·영업·바닥권리로 나뉘는데, 계약서에 뭉뚱그려 적히는 경우가 많습니다.</p><p>「상가건물 임대차보호법」 제10조의4 는 임대인이 정당한 이유 없이 권리금 회수를 방해하지 못하도록 하고 있습니다. 나갈 때를 생각하면 들어갈 때 계약서를 꼼꼼히 보셔야 합니다.</p><h2>순서를 지키면 덜 씁니다</h2><p>상권을 못 정했는데 간판부터 알아보시는 분이 실제로 많습니다. 앞 단계가 뒤 단계의 조건을 정합니다.</p><ul><li>좌석 수가 정해져야 → 화구 수가 나오고</li><li>화구 수가 정해져야 → 덕트 용량이 나오고</li><li>덕트 용량이 정해져야 → 전기 용량이 나옵니다</li></ul></noscript>
