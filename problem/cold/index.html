<noscript><h1>냉장 · 냉동이 안 될 때</h1><p>기사를 부르기 전 5분, 직접 확인할 수 있는 것들이 있습니다.</p><p>냉장이 안 된다고 부르신 것 중 상당수는 문 · 필터 · 설정 에서 끝납니다. 출장비를 내고 나서 &quot;문이 안 닫혔네요&quot; 를 듣는 일이 생각보다 많습니다.</p><p>다만 고기가 들어 있는 상태라 시간을 오래 끌면 안 됩니다. 아래 다섯 가지만 보시고, 안 되면 바로 부르세요. 그리고 부르실 때 무엇을 확인했는지 같이 말씀하시면 기사가 부품을 들고 옵니다 — 두 번 오지 않습니다.</p><h2>직접 확인할 것</h2><ul><li>문이 제대로 닫히나요. 가스켓(문 둘레 고무)이 찢어졌거나 굳어 있으면 닫혀도 새 나갑니다. 종이 한 장을 끼우고 닫아서 쉽게 빠지면 새고 있는 것입니다.</li><li>응축기(뒷면 · 윗면 방열판)에 먼지가 껴 있나요. 주방 먼지와 기름이 붙으면 열이 안 빠져 온도가 안 내려갑니다.</li><li>설정 온도가 바뀌어 있지 않나요. 청소하다 버튼이 눌리는 일이 잦습니다.</li><li>성에가 두껍게 꼈나요. 제상(서리 제거)이 안 되고 있다는 뜻이고, 그러면 바람이 안 돕니다.</li><li>차단기 · 전원 · 콘센트. 다른 기기와 같이 물려 쓰고 있지 않나요.</li></ul><h2>견적 받을 때 물어볼 것</h2><ul><li>출장비가 견적에 포함인가요, 따로인가요.</li><li>부품을 새로 주문해야 하면 며칠 걸리나요.</li><li>같은 고장이 다시 나면 보증이 되나요. 기간이 얼마인가요.</li><li>수리와 교체 중 어느 쪽을 권하시나요. 그 이유가 무엇인가요.</li><li>교체라면 기존 기기 반출 · 폐기 비용이 포함인가요.</li><li>(냉매) 어디서 새는지 찾고 막는 작업이 포함인가요.</li></ul></noscript>
