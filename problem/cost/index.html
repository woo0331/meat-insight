<noscript><h1>고기 원가가 안 맞을 때</h1><p>매입 단가가 오른 것과 같은 고기에서 덜 나오는 것은 처방이 다릅니다.</p><p>&quot;원가가 올랐다&quot; 는 말 안에는 서로 다른 세 가지가 섞여 있습니다 — 매입 단가가 오른 것, 같은 고기에서 덜 나오는 것(수율), 그리고 새는 것(폐기 · 시식 · 직원식)입니다.</p><p>셋은 해결 방법이 완전히 다릅니다. 단가가 문제면 거래처를 봐야 하고, 수율이 문제면 손질 기준과 들어오는 상태를 봐야 하고, 새는 것이 문제면 세는 방법부터 만들어야 합니다. 어느 쪽인지 모르고 거래처만 바꾸면 몇 달 뒤 같은 자리로 돌아옵니다.</p><h2>직접 확인할 것</h2><ul><li>최근 석 달 거래명세서를 부위별로 단가를 적어 보세요. 한 장에 모으면 어느 부위가 언제부터 올랐는지 바로 보입니다.</li><li>하루만 손질 전 무게와 손질 후 무게를 재 보세요. 이 둘의 비가 수율이고, 실제 1kg 원가는 여기서 나옵니다.</li><li>폐기 · 시식 · 직원식 · 서비스로 나간 것을 따로 적고 계신가요. 안 세면 그만큼이 전부 &quot;원가가 올랐다&quot; 로 보입니다.</li><li>메뉴별 판매량과 원가율을 나란히 놓아 보세요. 원가 높은 메뉴만 잘 나가면 매출이 늘어도 남는 돈은 줄어듭니다.</li></ul><h2>견적 받을 때 물어볼 것</h2><ul><li>이 단가는 어느 등급 · 산지 · 규격 기준인가요.</li><li>손질은 어디까지 되어 오나요 (정형 · 지방 제거 정도).</li><li>결제조건(현금 · 여신 · 기간)에 따라 단가가 달라지나요.</li><li>시세가 오르면 언제 · 어떻게 알려 주시나요.</li><li>최소 주문량과 배송 요일 · 시간은 어떻게 되나요.</li><li>상태가 안 좋을 때 반품 · 차감 기준이 있나요.</li></ul></noscript>
