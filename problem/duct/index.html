<noscript><h1>덕트 냄새 · 민원</h1><p>냄새 민원은 대개 얼마나 세게 빨아내느냐가 아니라 어디로 내보내느냐의 문제입니다.</p><p>민원이 들어오면 제일 먼저 &quot;더 센 모터&quot; 를 생각하시는데, 대개 그건 답이 아닙니다. 세게 빨아내도 나가는 자리가 남의 창문 앞이면 민원은 그대로입니다. 오히려 소음 민원이 하나 더 붙습니다.</p><p>그리고 급기(들어오는 공기)가 없으면 아무리 배기를 키워도 안 빠집니다. 빼낸 만큼 들어와야 도는데, 문틈으로만 들어오면 홀에서 주방 쪽으로 바람이 돌아 냄새가 홀에 깔립니다.</p><p>민원은 시간이 지날수록 불리해집니다. 언제 · 어떤 냄새로 들어왔는지 기록해 두세요. 나중에 구청이 물어봅니다.</p><h2>직접 확인할 것</h2><ul><li>배기구가 어디로 나가나요. 옆 건물 창문 · 위층 주거 · 사람 다니는 길 쪽이면 그것부터가 원인입니다.</li><li>후드 필터를 마지막으로 청소한 게 언제인가요. 기름이 차면 냄새가 그대로 통과합니다.</li><li>덕트 안쪽 기름때는 어떤가요. 점검구를 열어 보시면 압니다. (기름때는 냄새만이 아니라 화재 원인입니다.)</li><li>급기가 있나요. 배기만 달려 있는 집이 많습니다.</li><li>민원이 특정 시간대나 바람 방향에 몰리나요. 몰린다면 배기구 위치 문제일 가능성이 큽니다.</li></ul><h2>견적 받을 때 물어볼 것</h2><ul><li>배기구 위치를 바꿀 수 있나요. 안 되면 그 이유가 무엇인가요.</li><li>탈취 방식이 무엇이고 월 유지비가 얼마나 드나요 (필터 · 전기 · 약품).</li><li>청소 주기는 어떻게 되고, 그건 견적에 포함인가요 별도인가요.</li><li>소음이 얼마나 나나요. 야간에 돌려도 되나요.</li><li>공사 중에 영업을 할 수 있나요. 며칠 걸리나요.</li><li>A/S 기간과 범위가 어떻게 되나요.</li><li>건물 · 구청 신고나 허가가 필요한 공사인가요. 그건 누가 하나요.</li></ul></noscript>
