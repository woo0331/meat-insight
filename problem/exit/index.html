<noscript><h1>가게를 정리할 때</h1><p>순서를 지키면 덜 잃습니다. 폐업 신고를 먼저 하면 되돌릴 수 없습니다.</p><p>정리는 순서 싸움입니다. 같은 가게라도 어떤 순서로 하느냐에 따라 손에 남는 돈이 크게 달라집니다. 제일 많이 잃는 경우가 폐업 신고부터 해 버리는 것입니다 — 영업권이 사라지면 권리금을 받기가 훨씬 어려워집니다.</p><p>장비도 마찬가지입니다. 급하게 내놓으면 제값을 못 받습니다. 양도가 될지 안 될지를 먼저 보고, 안 되면 그때 장비를 따로 파는 쪽으로 갑니다.</p><p>권리금이 얼마인지는 저희가 말씀드릴 수 없습니다. 자리 · 업종 · 시기마다 다르고, 그 기준을 뒷받침할 데이터가 저희에게 없습니다.</p><h2>직접 확인할 것</h2><ul><li>임대차 계약서에서 해지 통보 시점 · 원상복구 범위 · 권리금 관련 조항을 먼저 읽으세요.</li><li>계약이 얼마나 남았는지 확인하세요. 남은 기간이 짧으면 양수인이 부담스러워합니다.</li><li>장비 목록을 연식과 함께 적어 두세요. 리스나 할부가 남아 있는 것이 있는지도 같이 봅니다.</li><li>직원이 있으면 해고 예고 기간과 남은 연차 · 퇴직금을 계산해 두세요.</li><li>거래처 미수 · 미지급을 정리하세요. 보증금을 맡긴 곳이 있는지도 확인하세요 (주류 · 식자재).</li><li>포스 · 배달앱 · 통신 · 정수기 같은 약정이 걸린 계약을 전부 꺼내 보세요. 중도 해지 위약금이 붙습니다.</li></ul><h2>견적 받을 때 물어볼 것</h2><ul><li>(양도) 어떻게 내놓아 주시나요. 어디에 올라가나요.</li><li>(양도) 수수료가 얼마이고 언제 내나요. 안 되면 안 내나요.</li><li>(장비) 어떤 기준으로 값을 매기나요. 직접 보고 매기나요.</li><li>(장비) 반출 · 운반 비용이 포함인가요.</li><li>(철거) 원상복구 범위를 어디까지로 보고 계산하신 건가요.</li><li>(철거) 폐기물 처리가 포함인가요.</li><li>언제 오셔서 며칠 걸리나요.</li></ul></noscript>
