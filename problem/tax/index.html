<noscript><h1>세무 · 신고</h1><p>덜 내는 법보다 빠뜨리지 않는 것이 먼저입니다.</p><p>고깃집 · 정육점은 매입 증빙이 많이 새는 업종입니다. 육류는 면세와 과세가 섞여 있고, 시장에서 현금으로 사 오는 것이 끼면 증빙이 빠집니다. 빠진 증빙은 나중에 채울 수 없습니다.</p><p>그리고 음식점에는 농축수산물 매입에 대한 의제매입세액공제 제도가 있습니다. 한도와 공제율은 업종 · 규모 · 연도에 따라 다르고 자주 바뀌므로, 반드시 세무서나 세무대리인에게 그해 기준을 확인하세요. 여기에 숫자를 적어 두면 그게 틀린 정보가 됩니다.</p><h2>직접 확인할 것</h2><ul><li>육류 매입에 대해 세금계산서 · 계산서를 전부 받고 계신가요. 면세와 과세가 구분되어 있나요.</li><li>의제매입세액공제를 받고 계신가요. 모르시면 그것부터 물어보세요.</li><li>카드 · 현금영수증 매출과 POS 매출이 맞나요.</li><li>4대보험 신고 인원이 실제 근무 인원과 맞나요.</li><li>사업용 계좌와 사업용 카드를 따로 쓰고 계신가요. 섞이면 나중에 가리는 데 시간이 많이 듭니다.</li></ul><h2>견적 받을 때 물어볼 것</h2><ul><li>기장 범위에 부가세 · 종합소득세 신고가 포함인가요.</li><li>4대보험 취득 · 상실 신고까지 해 주시나요.</li><li>월 비용에 무엇이 빠져 있나요 (연말정산 · 결산 · 조정 수수료).</li><li>의제매입세액공제를 우리 가게가 받을 수 있나요. 받으려면 제가 무엇을 드려야 하나요.</li><li>자료는 언제까지 어떤 형태로 드리면 되나요.</li><li>세무조사나 소명 요구가 오면 어디까지 대응해 주시나요.</li></ul></noscript>
