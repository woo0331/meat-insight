<!doctype html><meta charset="utf-8">
<title>공유 미리보기 원본 (og.jpg)</title>
<!-- ════════════════════════════════════════════════════════════════
     카카오톡 · 페이스북 · 슬랙에 링크를 붙였을 때 뜨는 그림입니다.
     `node tools/og.js` 가 이 화면을 1200×630 으로 찍어 `/og.jpg` 로
     씁니다. 손으로 열어 봐도 됩니다.

     ⚠️ **글꼴 CDN 을 부르지 않습니다.** 막힌 곳에서 찍으면 한글이
     네모로 나옵니다 — 기계에 깔린 Pretendard 를 그대로 씁니다.
     없으면 `tools/og.js` 가 무엇을 깔아야 하는지 알려 줍니다.

     ⚠️ **브랜드 이름을 여기 적지 마세요.** `js/data/brand.js` 에서
     읽어 넣습니다 (`data-brand` · `data-sub`). 이름을 정하시면
     그 한 줄만 바꾸면 이 그림도 같이 바뀝니다.

     ⚠️⚠️ **숫자를 넣지 마세요.** 매입가 · 업체 수 · 거래 건수는 지금
     전부 0 이고, 공유 미리보기는 우리 손을 떠나 한참 돌아다닙니다
     (절대 규칙 1 · PHONEWAY 지시서 "예시 데이터를 실제처럼 쓰지 마세요").
     ⚠️ **"최고가 보장" · "당일 정산" · "무료" 를 적지 마세요** — 지킬 수
     없는 약속이고, 한 번 퍼지면 오래 남습니다.
     ════════════════════════════════════════════════════════════════ -->
<style>
 html,body{ margin:0; padding:0; background:#FFFFFF; }
 .og{
   position:relative; width:1200px; height:630px; overflow:hidden;
   box-sizing:border-box;
   /* ⚠️ **아래 패딩이 브랜드 줄 자리입니다.** 브랜드는 absolute 로
      bottom:56px 에 붙는데, 가운데 정렬된 본문이 거기까지 내려와서
      알약과 **9px** 밖에 안 떨어진 적이 있습니다 (재서 알았습니다).
      아래를 넉넉히 비워 두면 본문이 그만큼 올라갑니다. */
   padding:64px 78px 126px;
   display:flex; flex-direction:column; justify-content:center;
   font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;
   color:#231A16; word-break:keep-all; letter-spacing:-.01em;
   /* 히어로와 같은 바탕 — 라이트 그레이에 좌 블루 · 우 그린 번짐.
      ⚠️⚠️ **여기 값은 css/tokens.css 를 못 읽습니다.** 팔레트를 바꿀
      때마다 이 파일만 옛 색으로 남았습니다 — 2026-10-13(베이지) ·
      2026-10-16(공유 미리보기가 한 판 뒤처짐) · 2026-10-29(PHONEWAY)
      **세 번**입니다. 404.html 과 같은 자리이고,
      `build-pages.js` 의 `checkOgPalette()` 가 빌드마다 봅니다. */
   background:
     radial-gradient(52% 70% at 2% 16%,  rgba(22,115,234,.14) 0%, rgba(22,115,234,0) 70%),
     radial-gradient(52% 70% at 98% 16%, rgba(22,160,133,.12) 0%, rgba(22,160,133,0) 70%),
     linear-gradient(180deg, #FFFFFF 0%, #F4E4D0 100%);
 }
 /* ⚠️ 머리말은 `--pw-or-700`(#A33E06 · 밝은 바탕 7.42)입니다 —
    `--pw-or`(#F37021)는 흰 바탕에서 **2.94** 라 글자로 못 씁니다. */
 .k{ font-size:23px; font-weight:900; letter-spacing:.26em; color:#A33E06; }
 h1{ margin:26px 0 0; font-size:96px; font-weight:900; line-height:1.06;
     letter-spacing:-.045em; color:#231A16; }
 h1 em{ font-style:normal; color:#D24601; }   /* 밝은 바탕 4.55 */
 p{ margin:26px 0 0; font-size:32px; font-weight:700; color:#231A16; }
 .pills{ margin-top:44px; display:flex; gap:16px; }
 .pill{ display:inline-flex; align-items:center; gap:10px;
        border-radius:16px; padding:18px 34px;
        font-size:26px; font-weight:800; color:#FFFFFF; }
 .pill-a{ background:#D24601; }   /* 흰 글자 4.55 */
 .pill-b{ background:#231A16; }   /* 딥 초콜릿 — 흰 글자 15.35 */
 /* 브랜드는 아래 왼쪽 한 줄 — 제목이 주인공입니다 */
 .brand{ position:absolute; left:78px; bottom:56px;
         display:flex; align-items:baseline; gap:14px; }
 .brand b{ font-size:28px; font-weight:900; letter-spacing:-.03em; color:#231A16; }
 /* ⚠️ 21px 은 큰 글자가 아니라 AA 4.5 를 넘겨야 합니다 — `--pw-ink2`(6.95).
    (`--pw-ink3`(#5C6675) 는 13px 짜리 `.pwf-n` 이 웜 바탕에서 4.42 로
     떨어져 2026-10-29 에 한 번 더 내린 값입니다.) */
 .brand span{ font-size:21px; color:#5A4433; }
 /* 아래 가장자리에 차콜 → 메인 오렌지 → 라이트 오렌지 한 줄 */
 .edge{ position:absolute; left:0; right:0; bottom:0; height:8px;
        background:linear-gradient(90deg,#231A16 0%,#F37021 54%,#FDEDDC 100%); }
</style>
<div class="og" id="og">
  <div class="k">SELL &amp; BUY</div>
  <!-- ⚠️⚠️ **화면의 히어로와 같은 말이어야 합니다.** 전에 메인 제목을
       바꾸면서 여기만 옛말로 남은 적이 있습니다 — 공유 미리보기는 우리
       손을 떠나 한참 돌아다녀서 거기만 다른 말을 하면 오래 남습니다.
       지금 메인 히어로는 "지금, 당신의 폰이 / 새로운 가치를 만납니다." 입니다. -->
  <h1>지금, 당신의 폰이<br><em>새로운 가치를 만납니다.</em></h1>
  <p>가장 쉽고, 가장 높은 가격으로 폰웨이와 함께하세요.</p>
  <div class="pills">
    <span class="pill pill-a">내 폰 팔기 →</span>
    <span class="pill pill-b">중고폰 구매 →</span>
  </div>
  <div class="brand"><b id="og-brand"></b><span id="og-sub"></span></div>
  <div class="edge"></div>
</div>
<script>
  /* ⚠️ 이름을 여기 적지 않습니다 — tools/og.js 가 js/data/brand.js 를
     읽어 `data-brand` · `data-sub` 로 넣어 줍니다. 그냥 브라우저로
     열어 봤을 때만 아래 기본값이 보입니다. */
  var d = document.documentElement.dataset;
  document.getElementById("og-brand").textContent = d.brand || "";
  document.getElementById("og-sub").textContent   = d.sub   || "중고폰 통합 거래 플랫폼";
</script>
