<!doctype html><meta charset="utf-8">
<title>공유 미리보기 원본 (og.jpg)</title>
<!-- ════════════════════════════════════════════════════════════════
     카카오톡 · 페이스북 · 슬랙에 링크를 붙였을 때 뜨는 그림입니다.
     `node tools/og.js` 가 이 화면을 1200×630 으로 찍어 `/og.jpg` 로
     씁니다. 손으로 열어 봐도 됩니다.

     ⚠️ **글꼴 CDN 을 부르지 않습니다.** 막힌 곳에서 찍으면 한글이
     네모로 나옵니다 — 기계에 깔린 Pretendard 를 그대로 씁니다.
     없으면 `tools/og.js` 가 무엇을 깔아야 하는지 알려 줍니다.

     ⚠️ **브랜드 이름을 여기 적지 마세요.** `js/data/brand.js` 에서
     읽어 넣습니다 (`data-brand` · `data-sub`). 이름을 정하시면
     그 한 줄만 바꾸면 이 그림도 같이 바뀝니다.

     ⚠️ **숫자를 넣지 마세요.** 업체 수 · 실적은 지금 0 이고, 공유
     미리보기는 우리 손을 떠나 한참 돌아다닙니다 (절대 규칙 1).
     ════════════════════════════════════════════════════════════════ -->
<!-- 2026-11-19 — 새 디자인(네이비 · 화이트 · 블루 + 전문관 넷의 색)으로 다시 짰습니다.
     ⚠️ 사진은 메인 히어로와 같은 hero-start(사장님이 주신 원본)이고 tools/og.js 가 넣습니다
     (setContent 라 상대 경로로는 안 읽힙니다). 사진 위 글자는 왼쪽 짙은 판 위에만 앉습니다.
     ⚠️ 문구는 메인 히어로와 같은 말입니다 — 바꾸시면 둘 다 고치세요. -->
<style>
 html,body{ margin:0; padding:0; background:#38271F; }
 .og{ position:relative; width:1200px; height:630px; overflow:hidden; box-sizing:border-box;
   padding:58px 72px 110px; display:flex; flex-direction:column; justify-content:center;
   font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;
   color:#FFFFFF; word-break:keep-all; letter-spacing:-.01em; background:#38271F; }
 .ph{ position:absolute; top:0; right:0; height:100%; width:66%; object-fit:cover; object-position:50% 45%; }
 /* ⚠️ 글이 앉는 왼쪽 600px 은 판이 거의 불투명합니다 — 사진 위 글자는 검사가 못 잽니다 */
 .shade{ position:absolute; inset:0;
   background:linear-gradient(90deg, #38271F 0%, #38271F 44%, rgba(56,39,31,.78) 60%, rgba(56,39,31,.18) 100%); }
 .in{ position:relative; max-width:720px; }
 .k{ display:inline-block; font-size:22px; font-weight:800; color:#FFFFFF;
     border:1.5px solid rgba(255,255,255,.55); border-radius:999px; padding:9px 20px; }
 h1{ margin:24px 0 0; font-size:62px; font-weight:900; line-height:1.14; letter-spacing:-.04em; color:#FFFFFF; }
 h1 em{ font-style:normal; color:#DCCBB5; }   /* --acc — 짙은 판 위 7.1 */
 p{ margin:20px 0 0; font-size:25px; font-weight:600; line-height:1.5; color:rgba(255,255,255,.9); }
 .pills{ margin-top:34px; display:flex; flex-wrap:wrap; gap:12px; }
 .pill{ border-radius:12px; padding:13px 20px; font-size:22px; font-weight:800; color:#FFFFFF; }
 .p1{ background:#584338; } .p2{ background:#6E4A33; } .p3{ background:#4A372D; } .p4{ background:#7A5633; }
 .brand{ position:absolute; left:72px; bottom:46px; display:flex; align-items:baseline; gap:14px; }
 .brand b{ font-size:30px; font-weight:900; font-style:italic; letter-spacing:-.01em; color:#FFFFFF; }
 .brand span{ font-size:20px; color:rgba(255,255,255,.82); }
 .edge{ position:absolute; left:0; right:0; bottom:0; height:8px;
   background:linear-gradient(90deg,#584338 0%,#6E4A33 33%,#4A372D 66%,#7A5633 100%); }
</style>
<div class="og" id="og">
  <img class="ph" id="og-ph" alt="">
  <div class="shade"></div>
  <div class="in">
    <div class="k">창업 · 운영 · 양도양수 · 폐업까지</div>
    <h1>자영업의 <em>모든 순간을</em><br>연결합니다.<span id="og-h1b" hidden></span></h1>
    <p>창업부터 매장 운영, 양도양수, 폐업 · 철거까지 한곳에서 준비하세요.</p>
    <div class="pills">
      <span class="pill p1">창업 준비</span><span class="pill p2">매장 운영</span>
      <span class="pill p3">매장 양도양수</span><span class="pill p4">폐업 · 철거</span>
    </div>
  </div>
  <div class="brand"><b id="og-brand"></b><span id="og-sub"></span></div>
  <div class="edge"></div>
</div>
<script>
  /* ⚠️ 이름 · 조사를 손으로 적지 않습니다 — 받침이 없거나 한글이 아니면 "가", 있으면 "이" */
  function ogJosa(n){ var c = (n||"").charCodeAt((n||"").length-1);
    return (c >= 0xAC00 && c <= 0xD7A3 && (c-0xAC00) % 28) ? "이" : "가"; }
  window.ogPaint = function(name, sub){
    document.getElementById("og-brand").textContent = name || "";
    document.getElementById("og-sub").textContent   = sub || "";
    document.getElementById("og-h1b").textContent   = (name || "") + ogJosa(name);
  };
  var d = document.documentElement.dataset; ogPaint(d.brand, d.sub);
</script>
