<!doctype html><meta charset="utf-8">
<title>공유 미리보기 원본 (og.jpg)</title>
<!-- ════════════════════════════════════════════════════════════════
     카카오톡 · 페이스북 · 슬랙에 링크를 붙였을 때 뜨는 그림입니다.
     `node tools/og.js` 가 이 화면을 1200×630 으로 찍어 `/og.jpg` 로
     씁니다. 손으로 열어 봐도 됩니다.

     ⚠️ **글꼴 CDN 을 부르지 않습니다.** 막힌 곳에서 찍으면 한글이
     네모로 나옵니다 — 기계에 깔린 Pretendard 를 그대로 씁니다.
     없으면 `tools/og.js` 가 무엇을 깔아야 하는지 알려 줍니다.

     ⚠️ **브랜드 이름을 여기 적지 마세요.** `js/data/brand.js` 에서
     읽어 넣습니다 (`data-brand` · `data-sub`). 이름을 정하시면
     그 한 줄만 바꾸면 이 그림도 같이 바뀝니다.

     ⚠️ **숫자를 넣지 마세요.** 업체 수 · 실적은 지금 0 이고, 공유
     미리보기는 우리 손을 떠나 한참 돌아다닙니다 (절대 규칙 1).
     ════════════════════════════════════════════════════════════════ -->
<style>
 html,body{ margin:0; padding:0; background:#fff; }
 .og{
   position:relative; width:1200px; height:630px; overflow:hidden;
   box-sizing:border-box;
   /* ⚠️ **아래 패딩이 브랜드 줄 자리입니다.** 브랜드는 absolute 로
      bottom:56px 에 붙는데, 가운데 정렬된 본문이 거기까지 내려와서
      알약과 **9px** 밖에 안 떨어졌습니다 (재서 알았습니다). 아래를
      넉넉히 비워 두면 본문이 그만큼 올라갑니다. */
   padding:64px 78px 126px;
   display:flex; flex-direction:column; justify-content:center;
   font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;
   color:#30241E; word-break:keep-all; letter-spacing:-.01em;
   /* 히어로와 같은 바탕 — 아이보리에 좌 창업 · 우 폐업 번짐.
      ⚠️⚠️ **여기 값은 css/tokens.css 를 못 읽습니다.** 2026-10-13 에
      팔레트를 베이지 · 브라운으로 바꿨는데 이 파일만 옛 초록 ·
      옛 주황 · 옛 남색으로 남아 있었습니다 — 404.html 과 같은
      자리입니다. **색을 바꾸면 여기도 같이 고치세요.** */
   background:
     radial-gradient(52% 70% at 2% 16%,  rgba(72,105,135,.16) 0%, rgba(72,105,135,0) 70%),
     radial-gradient(52% 70% at 98% 16%, rgba(173,99,63,.16) 0%, rgba(173,99,63,0) 70%),
     linear-gradient(180deg, #FFFFFF 0%, #FFFCF7 100%);
 }
 /* 샴페인 골드는 이 한 줄까지입니다 (§21) */
 /* ⚠️ 금빛 **글자**는 --gold-text(#7A5633) 입니다 — --gold 는 면 전용이라
    밝은 바탕에서 대비 1.54 입니다 (옛 #D5AA55 도 같은 까닭으로 안 됩니다) */
 .k{ font-size:23px; font-weight:900; letter-spacing:.26em; color:#7A5633; }
 h1{ margin:26px 0 0; font-size:96px; font-weight:900; line-height:1.06;
     letter-spacing:-.045em; color:#382820; }
 h1 em{ font-style:normal; }
 .st{ color:#3A5572; }   /* 창업 — --start-dark (7.54) */
 .cl{ color:#8A4A2A; }   /* 폐업 — --close-deep (6.63) */
 p{ margin:26px 0 0; font-size:32px; font-weight:700; color:#30241E; }
 .pills{ margin-top:44px; display:flex; gap:16px; }
 .pill{ display:inline-flex; align-items:center; gap:10px;
        border-radius:16px; padding:18px 34px;
        font-size:26px; font-weight:800; color:#fff; }
 .pill-st{ background:#486987; }   /* 흰 글자 5.76 */
 .pill-cl{ background:#9A5633; }   /* 흰 글자 5.60 */
 /* 브랜드는 아래 왼쪽 한 줄 — 제목이 주인공입니다 */
 .brand{ position:absolute; left:78px; bottom:56px;
         display:flex; align-items:baseline; gap:14px; }
 .brand b{ font-size:28px; font-weight:900; letter-spacing:-.03em; color:#30241E; }
 .brand span{ font-size:21px; color:#675E55; }
 /* 아래 가장자리에 창업 → 에스프레소 → 폐업 한 줄 */
 .edge{ position:absolute; left:0; right:0; bottom:0; height:8px;
        background:linear-gradient(90deg,#486987 0%,#382820 52%,#9A5633 100%); }
</style>
<div class="og" id="og">
  <div class="k">START &amp; CLOSE</div>
  <!-- ⚠️ **화면의 히어로와 같은 말이어야 합니다.** 2026-10-01 에 랜딩을
       없애면서 메인 제목이 "창업부터 폐업까지." 에서 바뀌었는데, 여기만
       옛말로 남아 있었습니다 — 공유 미리보기는 우리 손을 떠나 한참
       돌아다니므로 거기만 다른 말을 하면 오래 남습니다.
       ⚠️ 숫자는 넣지 마세요 (절대 규칙 1). -->
  <h1><em class="st">창업</em>에 필요한 모든 것.<br>
      <em class="cl">폐업</em>에 필요한 모든 것.</h1>
  <p>시작부터 정리까지, 사장님에게 필요한 모든 것을 한곳에서.</p>
  <div class="pills">
    <span class="pill pill-st">창업 준비하기 →</span>
    <span class="pill pill-cl">사업 정리하기 →</span>
  </div>
  <div class="brand"><b id="og-brand"></b><span id="og-sub"></span></div>
  <div class="edge"></div>
</div>
<script>
  /* ⚠️ 이름을 여기 적지 않습니다 — tools/og.js 가 js/data/brand.js 를
     읽어 `data-brand` · `data-sub` 로 넣어 줍니다. 그냥 브라우저로
     열어 봤을 때만 아래 기본값이 보입니다. */
  var d = document.documentElement.dataset;
  document.getElementById("og-brand").textContent = d.brand || "";
  document.getElementById("og-sub").textContent   = d.sub   || "창업 · 폐업 전문 플랫폼";
</script>
