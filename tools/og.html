<!doctype html><meta charset="utf-8">
<title>공유 미리보기 원본 (og.jpg)</title>
<!-- ════════════════════════════════════════════════════════════════
     카카오톡 · 페이스북 · 슬랙에 링크를 붙였을 때 뜨는 그림입니다.
     `node tools/og.js` 가 이 화면을 1200×630 으로 찍어 `/og.jpg` 로
     씁니다. 손으로 열어 봐도 됩니다.

     ⚠️ **글꼴 CDN 을 부르지 않습니다.** 막힌 곳에서 찍으면 한글이
     네모로 나옵니다 — 기계에 깔린 Pretendard 를 그대로 씁니다.
     없으면 `tools/og.js` 가 무엇을 깔아야 하는지 알려 줍니다.

     ⚠️ **브랜드 이름을 여기 적지 마세요.** `js/data/brand.js` 에서
     읽어 넣습니다 (`data-brand` · `data-sub`). 이름을 정하시면
     그 한 줄만 바꾸면 이 그림도 같이 바뀝니다.

     ⚠️ **숫자를 넣지 마세요.** 업체 수 · 실적은 지금 0 이고, 공유
     미리보기는 우리 손을 떠나 한참 돌아다닙니다 (절대 규칙 1).
     ════════════════════════════════════════════════════════════════ -->
<!-- 2026-11-22 — Warm Premium 메인(a96253fa7)에 맞춰 다시 짰습니다.
     밝은 아이보리 바탕 · 왼쪽 브랜드와 대표 문구 · 오른쪽 ZIP 사진 두 장(01 창업 준비 · 04 폐업·철거).
     메인 첫 화면의 세 칸 구도를 그대로 줄인 것입니다.
     ⚠️ 사진은 승인된 insu_premium_assets.zip 의 두 장만 씁니다 — tools/og.js 가 data URI 로 넣습니다
        (setContent 라 상대 경로로는 안 읽힙니다). 다른 사진으로 바꾸지 마세요.
     ⚠️ 작은 공유 카드(카톡 · 페북 목록은 가로 400px 안팎)에서도 읽혀야 해서 글은
        브랜드 · 대표 문구 · 한 줄만 둡니다. 글자를 더 늘리면 작은 카드에서 먼저 뭉갭니다.
     ⚠️ 글은 사진 위에 앉지 않습니다 — 사진 위 글자는 대비를 검사가 못 잽니다.
        사진 위 딱지는 저마다 크림 바탕을 들고 있습니다.
     ⚠️ 색은 css/tokens.css 에 있는 값만 씁니다 (checkOgPalette 가 빌드마다 봅니다).
     ⚠️ 대표 문구는 메인 h1 과 같은 말입니다 — 바꾸시면 둘 다 고치세요. -->
<style>
 html,body{ margin:0; padding:0; background:#F5F1E9; }
 .og{ position:relative; width:1200px; height:630px; overflow:hidden; box-sizing:border-box;
   font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;
   color:#28221E; word-break:keep-all; letter-spacing:-.01em; background:#F5F1E9; }
 .in{ position:absolute; left:72px; top:0; bottom:0; width:600px; display:flex; flex-direction:column; justify-content:center; }
 .brand{ display:flex; align-items:center; gap:14px; }
 .mk{ width:52px; height:52px; border-radius:14px; background:#6A4B3B; display:flex; align-items:center; justify-content:center; }
 .mk svg{ width:38px; height:38px; }
 .mk path{ fill:#FFFCF7; fill-rule:evenodd; }
 .brand b{ font-size:44px; font-weight:900; letter-spacing:-.03em; color:#28221E; }
 .sub{ margin:14px 0 0; font-size:21px; font-weight:600; color:#6B5A4E; }
 .rule{ width:56px; height:3px; margin:34px 0 30px; background:#D9C6AD; }
 h1{ margin:0; font-family:"IIS Serif","Noto Serif KR",serif; font-size:56px; font-weight:600; line-height:1.24; letter-spacing:-.02em; color:#28221E; }
 h1 em{ font-style:normal; color:#6A4B3B; }
 .ln{ margin:26px 0 0; font-size:23px; font-weight:600; line-height:1.5; color:#6B5A4E; }
 .phs{ position:absolute; top:44px; bottom:44px; right:52px; width:452px; display:grid; grid-template-columns:1fr 1fr; gap:18px; }
 .pc{ position:relative; border-radius:22px; overflow:hidden; background:#D9C6AD; }
 .pc img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
 .pc1 img{ object-position:42% 50%; } .pc2 img{ object-position:40% 50%; }
 .tag{ position:absolute; left:16px; bottom:16px; padding:10px 18px; border-radius:999px; background:#FFFCF7;
       font-size:22px; font-weight:800; color:#28221E; }
 .edge{ position:absolute; left:0; right:0; bottom:0; height:8px; background:#6A4B3B; }
</style>
<div class="og" id="og">
  <div class="in">
    <div class="brand"><span class="mk"><svg id="og-mk" viewBox="0 0 24 24"><path id="og-mkp" d=""/></svg></span><b id="og-brand"></b></div>
    <p class="sub" id="og-sub"></p>
    <span class="rule"></span>
    <h1>자영업의 <em>모든 순간을</em><br>연결합니다</h1>
    <p class="ln">창업 · 운영 · 양도양수 · 폐업 · 철거까지 한곳에서</p>
  </div>
  <div class="phs">
    <div class="pc pc1"><img id="og-ph1" alt=""><span class="tag">창업 준비</span></div>
    <div class="pc pc2"><img id="og-ph2" alt=""><span class="tag">폐업 · 철거</span></div>
  </div>
  <div class="edge"></div>
</div>
<script>
  window.ogPaint = function(name, sub){
    document.getElementById("og-brand").textContent = name || "";
    document.getElementById("og-sub").textContent   = sub || "";
  };
  var d = document.documentElement.dataset; ogPaint(d.brand, d.sub);
</script>
