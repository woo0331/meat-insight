<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
 html,body{margin:0;padding:0}
 .og{position:relative;width:1200px;height:630px;overflow:hidden;background:#201C1B;
     font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;color:#fff;
     word-break:keep-all}
 .og img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 70%}
 .sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(24,20,19,.95) 0%,rgba(24,20,19,.86) 48%,rgba(24,20,19,.6) 100%)}
 .in{position:relative;padding:76px 72px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}
 .lg{font-size:26px;font-weight:800;letter-spacing:.06em;color:#fff;margin-bottom:34px}
 h1{font-size:76px;font-weight:800;letter-spacing:-.04em;line-height:1.2;margin:0 0 26px}
 em{font-style:normal;color:#C1272D}
 p{font-size:27px;line-height:1.6;color:rgba(255,255,255,.76);margin:0;max-width:34ch}
 .b{margin-top:38px;display:inline-flex;align-items:center;gap:10px;align-self:flex-start;
    background:#C1272D;border-radius:999px;padding:16px 32px;font-size:23px;font-weight:700}
</style>
<div class="og">
  <img src="/img/hero.svg" alt="">
  <div class="sh"></div>
  <div class="in">
    <div class="lg">ABOUTMEAT</div>
    <h1>고기 장사,<br>뭐가 <em>고민</em>이세요?</h1>
    <p>창업 · 원가 · 시설 · 매출 · 확장 · 정리까지.<br>상황만 적어 주시면 찾아 드립니다.</p>
    <div class="b">무료로 물어보기 →</div>
  </div>
</div>
